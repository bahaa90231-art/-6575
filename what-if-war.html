        const chapters = [{
            id: 'intro',
            title: 'المقدمة',
            content: `هذه الرواية ليست عن الحرب. الحرب حدثت وانتهت في الأخبار، لكنها لم تنته في البيوت.

    هذه الرواية عن سؤال واحد لا يفارقنا جميعاً، نسأله لأنفسنا كل ليلة قبل أن ننام، ولا نجرؤ على الإجابة عليه في الصباح.

    ماذا لو؟

    ماذا لو لم نخرج من بيتنا؟ ماذا لو لم نفترق؟ ماذا لو كان أبي هنا، وأخي هنا، وأنا لم أكبر بهذه السرعة؟

    أنا لا أكتب لتغيير الماضي، فالماضي لا يتغير. أنا أكتب لكي أفهم كيف وصلت إلى هنا. أكتب لأنني تعبت من الهروب من السؤال.

    كل شخصية في هذه الرواية تشبهني وتشبهك. كل بيت فيها هو بيتك. وكل "ماذا لو" فيها، هي "ماذا لو" التي في قلبك أيضاً.

    إذا وجدت نفسك في هذه الصفحات، فاعلم أنك لست وحدك.

    سليم

    رواية "ماذا لو ما كانت الحرب؟"`
        }, {
            id: 1,
            title: 'الفصل الأول: البيت',
            content: `بيتي لا يزال واقفاً. هذه الجملة وحدها تحتاج إلى رواية كاملة.

    في حارتنا في حلب القديمة، كل البيوت التي حولنا إما مهدمة أو تغير أصحابها، إلا بيتنا. بقي عندياً. بابه الخشب الأسود لا يزال هو نفسه، عليه نفس الخدش الذي صنعته بسكين المطبخ وأنا في السابعة، عندما كنت أحاول أن أكتب اسمي.

    وضعت المفتاح في القفل. المفتاح صدئ، والقفل أصدر صوتاً كأنه يئن. فتحت.

    الرائحة ضربتني أولاً. ليست رائحة خبز أمي كما كنت أتوقع. إنها رائحة رطوبة وغبار متراكم منذ ثماني سنوات. رائحة بيت نسي أن يسكنه أحد.

    دخلت. المطبخ على اليمين. الحنفية تنقط. نقطة... نقطة... كل نقطة كانت تعد ثانية من عمري الذي ضاع هنا. الصحون لا تزال في مكانها، مغسولة ومرتبة، لأن أمي رتبتها قبل أن نخرج وكنا نظن أننا سنعود بعد يومين.

    مشيت إلى غرفة المعيشة. السجادة نفسها، لكن لونها باهت. مكان التلفاز القديم لا يزال فارغاً على الحائط، وتحته بقعة أفتح من باقي الطلاء. أتذكر آخر مرة جلسنا هنا جميعاً، كنا نضحك على شيء تافه، ولم نكن نعلم أنها آخر مرة.

    ذهبت إلى غرفتي. سريري لا يزال هناك. فراشي مطوي بعناية فوقه، كما تركته أمي. على الحائط، ورقة امتحان الصف التاسع معلقة بدبوس صدئ. كنت قد حصلت على علامة عالية في الرياضيات. أمي قالت يومها وهي تضحك: "اتركها معلقة لنفرح بها". وبقيت معلقة ثماني سنوات.

    اقتربت وقرأت اسمي: سليم. ناديت بصوت خافت، كأنني أخشى أن أوقظ أحداً: "أمي؟"

    لم يرد أحد. صدى صوتي عاد إلي وحيداً.

    جلست على الأرض الباردة، في منتصف الغرفة الفارغة، وضعت رأسي بين يدي. لأول مرة منذ ثماني سنوات، سمحت لنفسي أن أسأل السؤال الذي كنت أهرب منه طوال الوقت، سألته بصوت عالٍ:

    ماذا لو ما كانت الحرب؟

    ماذا لو استيقظت الآن على صوت أمي وهي تصرخ من المطبخ: "سليم! قم، ستتأخر عن المدرسة!" بدلاً من أن استيقظ على صمت بيت فارغ يصم الآذان؟

    ماذا لو كان أخي ياسر لا يزال نائماً بجانبي في الغرفة المجاورة ويشخر بصوت عالٍ، بدلاً من أن يكون في المانيا، أراه فقط عبر شاشة هاتف صغيرة كل شهرين؟

            content: `بعد وفاة أبي، تركت المدرسة. لم يكن لدينا مال.

    وضعته أمام محلي لتصليح الموبايلات. وفي المساء، بعد أن أنهيت عملي ومسحت طاولتي، جلست على الكرسي الأبيض وسكبت كأس شاي ونظرت إلى الشارع كما كان يفعل أبي.

    مرّ طفل صغير يبيع المحارم، كان تعباناً. قلت له: "تعال." جاء وجلس على الأرض بجانب كرسيي، تماماً كما كنت أجلس بجانب كرسي أبي عندما كنت طفلاً.

    في تلك اللحظة فهمت أنني لم أعد سليم الطفل الذي ينتظر أباه ليحرسه. أنا صرت سليم الرجل الذي يجلس على الكرسي ليحرس غيره. أنا صرت الباب الجديد.

    لم يبقَ بيت في حلب. صحيح. لكن بقي كرسي. وصار عندي محل، وطاولة، وشاي، وطفل يجلس بجانبي. وهذا هو بيتي الجديد.`
        }, {
            id: 'outro',
            title: 'الخاتمة',
            content: `خلصت حكايتي.

    عشر فصول كتبتها، وكل فصل كنت أقول فيه "ماذا لو". ماذا لو لم يتوفى أبي، ماذا لو لم ننزح، ماذا لو بقيت نور، ماذا لو بقي البيت.

    وفي الآخر اكتشفت أن "ماذا لو" ما بتغير الماضي، بس بتعلمنا كيف نعيش الحاضر.

    أنا اليوم سليم، عمري 22 سنة، أصلح موبايلات في محل صغير، وعندي كرسي أبيض جديد قدام المحل. أمي لساتها معي، تدعي لي كل صباح. أبي ليس معي بجسده، لكنه معي بكرسيه، بنصائحه، بصوته وهو يقول لي: "إذا خرب البيت كله، ابن بيتاً جديداً."

    تعلمت أن البيت ليس حيطاناً وحجارة. البيت هو الكرسي الذي تجلس عليه، والطاولة التي تصلح عليها الهواتف، وكأس الشاي، والطفل الذي يجلس بجانبك.

    وتعلمت أن الحب، والحرب، والنزوح، والموت، كلها براغي صغيرة في هاتف كبير اسمه الحياة. أحياناً يضيع برغي، وأحياناً ينكسر شيء، لكن الهاتف يبقى يعمل إذا أصلحته بحب.

    هذه الرواية ليست عني فقط. هي عن كل واحد نزح، وكل واحد فقد بيته، وكل واحد فقد أباه، وكل واحد أحب ولم يستطع أن يقول أحبك.

    إذا كنت تقرأ هذه الرواية وأنت نازح مثلي، أريد أن أقول لك: لم يبق بيت؟ اصنع باباً جديداً. اصنع كرسياً أبيض جديداً، واجلس عليه، وابدأ من جديد.

    لأننا، رغم كل شيء، باقون.

    تمت بحمد الله.

    شادي`
        }];

        // ============================================================
        //  RENDER CHAPTERS
        // ============================================================
        const gridContainer = document.getElementById('chaptersGrid');

        function renderChapters() {
            gridContainer.innerHTML = chapters.map((ch) => {
                let label = ch.id;
                if (ch.id === 'intro') label = 'م';
                else if (ch.id === 'outro') label = 'خ';
                else label = ch.id;
                return `
                    <div class="chapter-card" data-id="${ch.id}" role="button" tabindex="0" aria-label="قراءة ${ch.title}">
                        <div class="num">${label}</div>
                        <div class="title">${ch.title}</div>
                        <div class="icon-read"><i class="fas fa-chevron-left"></i> اقرأ</div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.chapter-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.dataset.id;
                    openChapter(id);
                });
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const id = this.dataset.id;
                        openChapter(id);
                    }
                });
            });
        }

        // ============================================================
        //  OPEN / CLOSE CHAPTER
        // ============================================================
        const view = document.getElementById('chapterView');
        const viewNum = document.getElementById('viewNum');
        const viewTitle = document.getElementById('viewTitle');
        const viewBody = document.getElementById('viewBody');

        function openChapter(id) {
            const ch = chapters.find(c => c.id === id);
            if (!ch) return;

            if (id === 'intro') viewNum.textContent = 'المقدمة';
            else if (id === 'outro') viewNum.textContent = 'الخاتمة';
            else viewNum.textContent = `الفصل ${id}`;

            viewTitle.textContent = ch.title;

            const paragraphs = ch.content.split('\n\n').filter(p => p.trim().length > 0);
            let html = '';
            paragraphs.forEach((p, i) => {
                const trimmed = p.trim();
                if (trimmed.length === 0) return;
                if (i === 0) {
                    const firstChar = trimmed.charAt(0);
                    const rest = trimmed.slice(1);
                    html += `<p><span class="first-letter">${firstChar}</span>${rest}</p>`;
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            });
            viewBody.innerHTML = html;
            view.classList.add('active');
            view.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeChapter() {
            view.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  DOWNLOAD PDF
        // ============================================================
        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            const btn = this;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> جاري التحميل...';

            const elementsToHide = document.querySelectorAll('.header .back-btn, .header .chapters-badge, .toolbar, .chapter-view .ch-close, .chapters-grid');
            elementsToHide.forEach(el => el.style.display = 'none');

            const pdfContainer = document.createElement('div');
            pdfContainer.id = 'pdfContainer';
            pdfContainer.style.cssText = 'padding: 30px; background: #fff; color: #000; direction: rtl; font-family: Cairo, sans-serif; max-width: 100%;';

            pdfContainer.innerHTML = `
                <div style="text-align:center; margin-bottom:30px;">
                    <h1 style="font-size:32px; color:#6C3CE1; margin-bottom:5px;">🕊️ ماذا لو ما كانت الحرب؟</h1>
                    <p style="color:#666; font-size:16px;">رواية تأملية عن النزوح والفقد والأمل</p>
                    <p style="color:#999; font-size:14px; margin-top:8px;">رواية للكاتب شادي رحال</p>
                    <hr style="border:1px solid #eee; margin:20px auto; max-width:200px;" />
                </div>
            `;

            chapters.forEach((ch) => {
                let label = ch.id;
                if (ch.id === 'intro') label = 'المقدمة';
                else if (ch.id === 'outro') label = 'الخاتمة';
                else label = `الفصل ${ch.id}`;

                const content = ch.content.replace(/\n/g, '<br>');
                pdfContainer.innerHTML += `
                    <div style="margin-bottom:25px; page-break-inside:avoid;">
                        <h2 style="color:#6C3CE1; font-size:20px; margin-bottom:8px; border-bottom:2px solid #6C3CE1; padding-bottom:8px; display:inline-block;">
                            ${label}: ${ch.title}
                        </h2>
                        <div style="line-height:2.2; font-size:16px; color:#333; margin-top:12px;">${content}</div>
                    </div>
                    <hr style="border:0.5px solid #eee; margin:20px 0;" />
                `;
            });

            pdfContainer.innerHTML += `
                <div style="text-align:center; color:#999; font-size:14px; margin-top:30px; border-top:1px solid #eee; padding-top:20px;">
                    ❤️ جميع الحقوق محفوظة &copy; 2026 شادي رحال ❤️
                </div>
            `;

            document.body.appendChild(pdfContainer);

            const opt = {
                margin: [15, 15, 15, 15],
                filename: 'ماذا_لو_ما_كانت_الحرب_شادي_رحال.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    letterRendering: true,
                    scrollY: 0,
                    windowHeight: pdfContainer.scrollHeight
                },
                jsPDF: {
                    unit: 'mm',
                    format: 'a4',
                    orientation: 'portrait'
                },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(pdfContainer).save().then(() => {
                elementsToHide.forEach(el => el.style.display = '');
                document.body.removeChild(pdfContainer);
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-file-pdf"></i> تحميل الرواية كـ PDF';
            }).catch(() => {
                elementsToHide.forEach(el => el.style.display = '');
                document.body.removeChild(pdfContainer);
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-file-pdf"></i> تحميل الرواية كـ PDF';
                alert('حدث خطأ أثناء تحميل PDF، يرجى المحاولة مرة أخرى.');
            });
        });

        // ============================================================
        //  INIT
        // ============================================================
        renderChapters();
    </script>
</body>
