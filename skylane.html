    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0A0A0A;
            --bg-elevated: #111111;
            --bg-hover: #1A1A1A;
            --bg-subtle: #161616;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-tertiary: #71717A;
            --primary: #7C3AED;
            --primary-hover: #8B5CF6;
            --primary-subtle: rgba(124, 58, 237, 0.1);
            --gold: #F59E0B;
            --gold-subtle: rgba(245, 158, 11, 0.1);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg: #FAFAFA;
            --bg-elevated: #FFFFFF;
            --bg-hover: #F4F4F5;
            --bg-subtle: #F9F9FA;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.16);
            --text: #09090B;
            --text-secondary: #52525B;
            --text-tertiary: #71717A;
            --primary: #7C3AED;
            --primary-hover: #6D28D9;
            --primary-subtle: rgba(124, 58, 237, 0.08);
            --gold: #D97706;
            --gold-subtle: rgba(217, 119, 6, 0.08);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition), color var(--transition);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: saturate(180%) blur(16px);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            min-height: 64px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition);
        }

        .back-btn:hover {
            color: var(--text);
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-align: center;
            flex: 1;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        body:not(.light-mode) .theme-toggle .fa-sun { display: none; }
        body.light-mode .theme-toggle .fa-moon { display: none; }

        /* HERO */
        .hero {
            padding: 60px 0 40px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--primary-subtle), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .hero-text .novel-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .hero-text h1 {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            background: linear-gradient(180deg, var(--text) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-text p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 24px;
            max-width: 500px;
        }

        .hero-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .hero-meta i {
            color: var(--primary);
        }

        .btn-pdf {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .btn-pdf:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
        }

        .btn-pdf.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .btn-pdf.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        .hero-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
        }

        /* CHAPTERS SECTION */
        .chapters-section {
            padding: 40px 0 80px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .section-header .count {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .chapters-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }

        .chapter-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .chapter-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .chapter-card:hover .arrow {
            transform: translateX(-4px);
            color: var(--primary);
        }

        .chapter-card .num {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .chapter-card .title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .chapter-card .arrow {
            font-size: 12px;
            color: var(--text-tertiary);
            transition: all var(--transition);
            margin-top: 4px;
        }

        /* CHAPTER VIEW (Fullscreen) */
        .chapter-view {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--bg);
            overflow-y: auto;
            padding: 24px;
        }

        .chapter-view.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chapter-view-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .chapter-view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 24px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: color-mix(in srgb, var(--bg) 90%, transparent);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10;
            flex-wrap: wrap;
        }

        .chapter-view-header .title-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 200px;
        }

        .chapter-view-header .ch-num {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-subtle);
            color: var(--primary);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .chapter-view-header .ch-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .btn-close {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-close:hover {
            color: var(--text);
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        .chapter-body {
            font-size: 17px;
            line-height: 2;
            color: var(--text);
            letter-spacing: -0.005em;
            padding-bottom: 60px;
        }

        .chapter-body p {
            margin-bottom: 1.4rem;
        }

        .chapter-body .first-letter {
            font-size: 3.2rem;
            font-weight: 800;
            float: right;
            margin-left: 12px;
            margin-top: 6px;
            color: var(--primary);
            line-height: 0.9;
        }

        /* FOOTER */
        .footer {
            border-top: 1px solid var(--border);
            padding: 40px 0 24px;
            background: var(--bg-subtle);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .footer-bottom .copy .author {
            color: var(--text);
            font-weight: 600;
        }

        .dev-credit {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .dev-credit i {
            color: var(--primary);
        }

        .dev-credit .phone {
            direction: ltr;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .hero-cover {
                max-width: 500px;
                margin: 0 auto;
            }

            .hero-text h1 {
                font-size: 40px;
            }
        }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .hero { padding: 40px 0 30px; }
            .hero-text h1 { font-size: 32px; }
            .hero-text p { font-size: 14px; }
            .hero-meta { font-size: 12px; gap: 14px; }
            .btn-pdf { padding: 10px 20px; font-size: 13px; }
            .chapters-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .chapter-card { padding: 14px 12px; }
            .chapter-card .num { font-size: 20px; }
            .chapter-card .title { font-size: 12px; }
            .chapter-view { padding: 16px; }
            .chapter-body { font-size: 16px; line-height: 1.9; }
            .chapter-view-header { padding-bottom: 16px; margin-bottom: 24px; }
            .chapter-view-header .ch-title { font-size: 14px; }
        }

        @media (max-width: 480px) {
            .container { padding: 0 16px; }
            .header-inner { padding: 12px 0; }
            .header-title { display: none; }
            .hero { padding: 30px 0 20px; }
            .hero-text h1 { font-size: 26px; }
            .hero-text p { font-size: 13px; }
            .chapters-grid { gap: 8px; }
            .chapter-card { padding: 12px 10px; }
            .chapter-card .num { font-size: 18px; }
            .chapter-card .title { font-size: 11px; -webkit-line-clamp: 3; }
            .chapter-view { padding: 12px; }
            .chapter-body { font-size: 15px; line-height: 1.85; }
            .chapter-body .first-letter { font-size: 2.4rem; }
            .footer-bottom { flex-direction: column; text-align: center; }
        }
    </style>
</head>

    <script>
        // THEME TOGGLE
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.body.classList.add('light-mode');
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('light-mode');
                const isLight = document.body.classList.contains('light-mode');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            });
        })();

        // ============================================================
        //  DATA - فصول سكاي لاين
        // ============================================================
        const chapters = [{
            id: 0,
            title: 'المقدمة',
            content: `في كل مدينة في باب... باب معهد، باب بيت، باب قلب. بس مو كل الأبواب بتنفتح، وبعضها إذا انفتح... بيتسكر للأبد.

    هذي مو قصة حب عادية. هذي قصة ولد كان بدو يعلم، وبنت كانت بدها تتعلم. بلشت بكرسي وطاولة... وانتهت بوعد ودمعة.

    هذي قصة "سكاي لين". المكان اللي جمعنا، والاسم اللي سميناه على حلمنا. هون تعلمنا الحب قبل الرياضيات، وهون تعلمنا الفراق قبل التخرج.

    في هالقصة رح تشوفوا فرق العمر، ورح تشوفوا العادات، ورح تشوفوا أب عنيد، وأم قلبها طيب، ورح تشوفوا خاتم اتكبر واتيدل، وأسماء ولاد انحكت واننسيت.

    ...بس قبل كل هاد
    تذكروا شي واحد:

    الحب رزق. والرزق إذا ما لحقته بإيدك، رح يلحقه غيرك.
    والأقدار مكتوبة... ونحنا بس عم نعيشها.

    أنا رامي
    وهي قصة "عسل"
    وهي قصة الدقيقة 3:13`
        }, {
            id: 1,
            title: 'الفصل الأول: أول وجهين',
            content: `*7 أكتوبر 2017*

        // ============================================================
        //  RENDER CHAPTERS
        // ============================================================
        const gridContainer = document.getElementById('chaptersGrid');

        function renderChapters() {
            gridContainer.innerHTML = chapters.map((ch, idx) => `
                <div class="chapter-card" data-index="${idx}" role="button" tabindex="0">
                    <div class="num">${idx === 0 ? 'م' : idx}</div>
                    <div class="title">${ch.title}</div>
                    <i class="fas fa-arrow-left arrow"></i>
                </div>
            `).join('');

            document.querySelectorAll('.chapter-card').forEach(card => {
                card.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    openChapter(idx);
                });
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const idx = parseInt(this.dataset.index);
                        openChapter(idx);
                    }
                });
            });
        }

        // ============================================================
        //  OPEN / CLOSE CHAPTER
        // ============================================================
        const view = document.getElementById('chapterView');
        const viewNum = document.getElementById('viewNum');
        const viewTitle = document.getElementById('viewTitle');
        const viewBody = document.getElementById('viewBody');

        function openChapter(idx) {
            const ch = chapters[idx];
            if (!ch) return;
            viewNum.textContent = idx === 0 ? 'المقدمة' : `الفصل ${idx}`;
            viewTitle.textContent = ch.title;

            const paragraphs = ch.content.split('\n\n').filter(p => p.trim().length > 0);
            let html = '';
            paragraphs.forEach((p, i) => {
                const trimmed = p.trim();
                if (trimmed.length === 0) return;
                if (i === 0) {
                    const firstChar = trimmed.charAt(0);
                    const rest = trimmed.slice(1);
                    html += `<p><span class="first-letter">${firstChar}</span>${rest}</p>`;
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            });
            viewBody.innerHTML = html;
            view.classList.add('active');
            document.body.style.overflow = 'hidden';
            history.pushState({ idx }, '', `#chapter-${idx}`);
            view.scrollTop = 0;
        }

        function closeChapter() {
            view.classList.remove('active');
            document.body.style.overflow = '';
            history.pushState({}, '', window.location.pathname);
        }

        window.addEventListener('popstate', function() {
            if (view.classList.contains('active')) {
                view.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        window.addEventListener('load', function() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#chapter-')) {
                const idx = parseInt(hash.replace('#chapter-', ''));
                if (!isNaN(idx) && chapters[idx]) {
                    setTimeout(() => openChapter(idx), 100);
                }
            }
        });

        // ============================================================
        //  DOWNLOAD PDF
        // ============================================================
        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            const btn = this;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> جاري التحميل...';

            const pdfContainer = document.createElement('div');
            pdfContainer.id = 'pdfContainer';
            pdfContainer.style.cssText = 'padding: 40px; background: #fff; color: #000; direction: rtl; font-family: Cairo, sans-serif;';

            pdfContainer.innerHTML = `
                <div style="text-align:center; margin-bottom:40px; padding-bottom:20px; border-bottom:2px solid #7C3AED;">
                    <h1 style="font-size:32px; color:#7C3AED; margin-bottom:8px;">سكاي لاين</h1>
                    <p style="color:#666; font-size:16px;">قصة حب بين أستاذ وطالبة</p>
                    <p style="color:#999; font-size:13px; margin-top:8px;">رواية للكاتب شادي رحال</p>
                </div>
            `;

            chapters.forEach((ch, idx) => {
                const title = idx === 0 ? 'المقدمة' : `الفصل ${idx}`;
                const content = ch.content.replace(/\n/g, '<br>');
                pdfContainer.innerHTML += `
                    <div style="margin-bottom:30px; page-break-inside:avoid;">
                        <h2 style="color:#7C3AED; font-size:20px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee;">
                            ${title}: ${ch.title}
                        </h2>
                        <div style="line-height:2; font-size:15px; color:#333; text-align:justify;">${content}</div>
                    </div>
                `;
            });

            pdfContainer.innerHTML += `
                <div style="text-align:center; color:#999; font-size:12px; margin-top:40px; padding-top:20px; border-top:1px solid #eee;">
                    جميع الحقوق محفوظة &copy; 2026 شادي رحال<br>
                    برمجة وتطوير: بهاء الدين الحسين - 0982520358
                </div>
            `;

            document.body.appendChild(pdfContainer);

            const opt = {
                margin: [15, 15, 15, 15],
                filename: 'سكاي_لاين_شادي_رحال.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(pdfContainer).save().then(() => {
                document.body.removeChild(pdfContainer);
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-file-pdf"></i> <span>تحميل PDF</span>';
            }).catch(() => {
                document.body.removeChild(pdfContainer);
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-file-pdf"></i> <span>تحميل PDF</span>';
                alert('حدث خطأ أثناء التحميل');
            });
        });

        renderChapters();
    </script>
