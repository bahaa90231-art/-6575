            title: 'الفصل الرابع: المفاجأة - كيكة عيد الميلاد',
            content: `آخر شهر 11

    يوم عيد ميلاد رامي. دخل عالمعهد متأخر شوي. فتح باب الصف ولقى الطالب عم يغنوا "كل سنة وانت طيب". وفي نص الطاولة كيكة. بس اللي صدمه مو الكيكة... اللي صدمه إنو عسل قاعدة جنبها وبتضحك.

    قلبه دق بسرعة مو من المفاجأة بس... من إنو هي اللي شايلة الكيك. حطت عسل القالب عالطاولة قدامو وقالت بخجل: "كل سنة وانت بخير. انت بتستاهل."
    فتح الهدية: بنطال وكذرة. بس الهدية الأكبر كانت نظرة عسل وهي عم تقولها.

    بهاليوم ما انشرح درس. انشرح شي تاني... إنو في حدا منتبه للتفاصيل الصغيرة تبعك.`
        }, {
            id: 5,
            title: 'الفصل الخامس: البنت القصيرة',
            content: `رامي كان معروف بين الطالب إنو دمو خفيف وبحب يمزح. بيوم كان الدرس عن "الصفات الشخصية" وطلب من الكل يكتبوا موضوع صغير عن حالهم. وبعدين بلش يلف عالطالب واحد يسأل:
    "قديش طولك؟ شو لون عيونك؟ طبعك عصبي وال هادي؟"

    إجا دور عسل. وقفت شوي وقالت طولها. رامي ابتسم وقال بمزح: "ما شاء الله... قصيرة بس شاطرة وبتجيب العيد بالعلامات."
    والصفي كلو ضحك وهي خجلت ونزلت راسها بس كانت مبتسمة.

    بالليل، رن الإشعار. رسالة من عسل.`
        }, {
            id: 6,
            title: 'الفصل السادس: تغير العلاقة',
            content: `عسل: "خالو بعرف شو قالت أمي عنك؟"
    رامي: "شو قالت؟"
    عسل: "قالت يا ريت يكون عندي أخ مثل أستاذك"

    بهالجملة الدنيا تغيرت. صار في ثقة من الأهل، وصار في راحة أكثر بالكلام. التفاصيل كبرت والتعلق كبر.`
        }, {
            id: 7,
            title: 'الفصل السابع: وردة بيضا',
            content: `أول شهر 12

    الحب بقلب رامي وقلب عسل صار يكبر. هي سجلت عنده بدورات تقوية تانية مشان المدرسة، وهو صار اهتمامه فيها أكبر من حاله.

    بيوم شافت وردة بيضا بحديقة المعهد. رجعت عالبيت وبعتله:
    عسل: "خالو ليش هاي الوردة مو عندي؟ ليش إلها مكانها وبس؟"
    رامي: "خلص بكرة رح جيبلك أحلى منها وأجمل. شو لون الورد اللي بتحبيه؟"
    عسل: "أبيض"

    تاني يوم الصبح، دخل عالمعهد وإيده ورا ضهره. وعطاها وردة بيضا.
    رامي: "هاي مشان ما يكون إلها مكان وبس... صار إلها مكان عندك"
    عسل مسكتها وفرحت فرحة كبيرة. وهو واقف عم يتفرج عليها... حس إنو عم يغرق بتفاصيلها شوي شوي. بس ما كان عرفان إنو هي كمان حابته ومو قادرة تحكي.`
        }, {
            id: 8,
            title: 'الفصل الثامن: اعتراف الصف الفاضي',
            content: `*15/12/2017*

    المعهد كان فاضي. شافها قاعدة لحالها بأول طاولة. فتت وقعد جنبها. بلشنا ندرس... عن الدراسة، عن اليوم، عن أشياء صغيرة. شوي شوي دخلنا بالحديث الجد.

    رامي: "عسل... انتي شو رأيك بعلاقتنا؟ حابة إنها تقوى وتتغير؟"
    عسل: "أي... حابة إنها تقوى وتتغير"
    رامي: "بتحبيني؟"
    عسل: "أي"
    رامي: "مستعدة تكوني معي كل العمر؟"
    عسل: "أي"
    رامي: "بتعرفي فرق العمر بيناتنا؟ أهلك ممكن يوافقوا؟"
    عسل: "يعني إذا ما وافقوا من أول مرة رح تبطل تحاول؟"

    بهاللحظة اعترفنا لبعض. أخذنا عهد إنو نضل لبعض كل العمر. ومن "خالو وبنت أختي" صرنا "حبي وحبيبتي".`
        }, {
            id: 9,
            title: 'الفصل التاسع: أول يوم بعد الاعتراف',
            content: `*16/12/2017*

    تاني يوم الصبح... الدنيا كلها كانت مختلفة. فوت رامي عالمعهد وقلبه داقق. وهي كانت قاعدة بمكانها المعتاد بأول طاولة، بس اليوم ابتسمت ابتسامة "حبيبتي" مش "طالبتي".

    ما تغير شي قدام الكل. ضل "أستاذ" و "طالبة" بالحصة. بس النظرات، طريقة الشرح، السؤال "فهمتي؟" صار فيهم دفا زيادة.

    بعد ما طلعوا الطالب، ضلت هي تتأخر 5 دقايق "عندها سؤال". وكان السؤال هو:
    عسل: "حبي... تعبت مبارح؟"
    رامي: "لا... بس كنت سهران عم فكر فيكي"`
        }, {
            id: 10,
            title: 'الفصل العاشر: قرار وعقبتين',
            content: `آخر شهر 12 - البرد بلش

    دخل آخر شهر 12 والجو صار بارد كثير. الشتوية نزلت على وادي الياسمين، والطالب صاروا يلبسوا جواكيت تقيلة. بس رامي وعسل كانوا عايشين بعالم لحالهم. كل يوم حكي، كل تفصيلة صغيرة صارت بيناتهم. "أكلتي؟"، "ديفتي؟"، "سهرانة على شو؟"

    الحب تبعهم كبر وصار هو روتينهم اليومي. ويوم من الأيام، بعد سهرة حكي للصبح، أخذوا القرار سوا:
    بدنا نتزوج`
        }, {
            id: 11,
            title: 'الفصل الحادي عشر: قبل المواجهة - الخطة',
            content: `عسل تحكي عن رامي لأمها بالبيت كل يوم شوي. "ماما اليوم رامي شرحلي درس صعب" "ماما خالو رامي زلمة محترم ويخاف الله وقلبه طيب" تزرع اسمه ببيتهم كـ "الأستاذ المحترم" بالأول.

    رامي يتواصل مع الأم عالهاتف بعد أسبوع من تمهيد عسل، رامي رح يتصل بأمها. ويخبرها إنو هو "أستاذ عسل بمعهد سكاي الين" وإنو حابب يطلب ايد بنتها عسل للزواج. والأهم: عسل ما عندها خبر بالموضوع

    الوقت المناسب رح يستنوا لآخر الشهر، بعد ما تخلص دورة التقوية. مشان ما حدا يقول أي كلمة غلط.

    اليوم اللي قبل الاتصال...
    عسل: "حبي انت متأكد؟"
    رامي: "متأكد. وإذا رفضت من أول مرة، رح ضل حاول. وعد"
    قلوبهم كانت تدق. الخطوة الجاية كانت أول مواجهة رسمية.`
        }, {
            id: 12,
            title: 'الفصل الثاني عشر: الرفض الأول - النسخة المعدلة',
            content: `نص شهر 1 - 2018

    اليوم اللي رامي اتصل فيه بأم عسل كان أسوأ يوم.

    رامي: "مرحبا خالة، معك رامي أستاذ عسل بمعهد سكاي الين. حابب أحكي معك بموضوع مهم... أنا ناوي أطلب ايد بنتك عسل"
    أم عسل: "نعم؟! انت كبير عليها. نحنا كرد وانتو عرب. القصة مرفوضة من أساسها. لا تعاود تتصل"
    رفض قاطع. سكرت بوجهه.

    رامي ما يأس. ما تراجع. ضل يحاول وضل مآمن إنو الحب بيقدر يكسر أي حاجز. بس بعدها بيومين... وصلته رسالة من أخت عسل:
    "استحي على حالك. شو مفكر حالك عم تعمل؟ نحنا ما بدنا عربي ولا بدنا فرق عمر. انسى الموضوع وبالفضايح"

    هون قلب رامي وجعه وتوتر. صار بدو يحافظ على حب عسل بأي طريقة كانت.

    بنفس الليلة أم عسل واجهت عسل:
    أم عسل: "عسل اسمعيني. الأستاذ رامي دق وطلبك. أنا رفضت. وبدك تنهي هالقصة هلق. وإلا رح خليكي تتركي المعهد وما عاد تشوفي لا المعهد ولا رامي. شفتي لوين وصلت كلمة خالو وبنت اختي؟"

    عسل انهارت. بكت وتاني يوم دقت لرامي:
    عسل: "رامي... أمي عرفت. وقالتلي لازم ننهي. وإلا رح تطلعني من المعهد"
    رامي قلبه تقطع عليها، بس رد عليها بكل ثبات:
    رامي: "عسل حبي. أنا ما رح أتخلى عنك. ولا رح أتخلى عن حبنا. خلينا نهدى ونفكر بحل. أنا معك للآخر"
    الحب هون دخل أصعب اختبار.`
        }, {
            id: 13,
            title: 'الفصل الثالث عشر: الوعد',
            content: `عسل: "حبي بس إذا طال الموضوع؟"
    رامي: "لو طال سنين. أنا وعدتك. والوعد دين"
    سكرت المكالمة وقلبها موجوع بس مرتاحة. لأنها عرفت إنو في حدا متمسك فيها للآخر. الرفض كسرهم شوي...بس ما كسرهم كامل.`
        }, {
            id: 14,
            title: 'الفصل الرابع عشر: شهور الصبر',
            content: `شهر 2 لشهر 4 - 2018

    الـ3 شهور هدول كانوا امتحان لرامي وعسل.

    القانون الجديد اللي اتفقوا عليه:

    بالمعهد: بس "صباح الخير أستاذ" و "يعطيك العافية" قدام الكل

    عالتلفون: رسالة وحدة بس الساعة 11 بالليل. "نمتي؟" "اي الحمدله انت؟"

    بالبيت: عسل مهمتها وحدة... تخلي اسم "الأستاذ رامي" ينذكر بالبيت بس بالمنيح

    كانت الأيام طويلة وتقيلة. رامي صار يشتغل شغلتين. يحط مصاري على جنب، للبيت ويثبت حاله بالمعهد. وعسل صارت الأولى عالدورة. كل علامة كانت بتجيبها كانت تقول لأمها "لولا شرح الأستاذ رامي".`
        }, {
            id: 15,
            title: 'الفصل الرابع عشر - تابع: الموقف اللي غير كل شي',
            content: `آخر شهر 2، أم عسل كان عندها معاملة مهمة بالدوائر الحكومية ومتعبة فيها. أوراق وتواقيع وطوابير. رامي سمع من عسل وبدون ما يحكي لحدا راح وساعدها. خلصها كلها بيوم واحد.

    تاني يوم دقت أم عسل لعسل:
    أم عسل: "الأستاذ رامي هو اللي خلصلي المعاملة؟ زلمة خير والله"

    ومن هون بلش رامي يتقرب من الأم بطريقته. كل فترة يسأل عنها، يطمن، يبعث سلام. صار اسم "رامي" بالبيت يعني "الزلمة اللي بيساعد".

    ...بعدها بـ 3 أسابيع أخذ القرار
    رامي: "خالة، بدي استأذنك بموضوع. بتحبي أطلع أنا وعسل مشوار؟ مشان نجيب كتب للمعهد"
    أم عسل: "لا. لسه بكير"
    رفضت. بس رامي ما استسلم.
    عسل من جهة: "ماما والله أستاذ وبس. وكل البنات بيطلعوا مع أستاذتهم"
    رامي من جهة: "خالة بوعدك برجعها قبل المغرب. وكون مسؤول عنها"
    ضلوا أسبوع كامل يقعوا فيها شوي شوي. لحد ما بالأخر قالت:
    أم عسل: "ماشي... بس ساعتين وترجع. وإذا تأخرت دقيقة وحدة ما عاد تشوفيه"

    طلعوا المشوار. كان أول مشوار لهم سوا من بعد الرفض. مافي كلام حب كتير. مافي شي غلط. بس مشيوا، شربوا قهوة، ضحكوا وحكوا عن المستقبل وعن الدراسة. ورجعوها قبل المغرب بـ 10 دقايق.

    لما فاتت عسل عالبيت أمها سألتها:
    أم عسل: "كيف كان؟"
    عسل: "منيح... الأستاذ محترم كتير"
    أم عسل: "الحمدلله"

    بهاليوم الجليد داب زيادة. الأم بلشت تشوف رامي مو بس "أستاذ..." بلشت تشوفه "زلمة بيثق فيه."

    بالليل رامي دق لعسل:
    رامي: "انبسطتي؟"
    عسل: "كتير والله. حسيت حالي رجعت عايشة"
    رامي: "وعد... كل المشاوير الجاية رح تكون بالحلال قدام الكل"`
        }, {
            id: 16,
            title: 'الفصل الخامس عشر: شهرين قبل العاصفة',
            content: `شهر 4 - شهر 6 | 2018

    كان باقي شهرين للمتحانات النهائية ورح تبدأ. الجو كله صار دراسة وتوتر. بس التوتر هاد كان حلو... لأنه كان "توتر سوا."

    بعد ما الأم وافقت على المشوار وصارت تثق برامي، صار في اتفاق جديد بيناتهم:
    نستنى نخلص امتحانات عسل، وبعدها فورا نحكي مع الأب.

    رامي: "خالة اتفقنا. بعد الامتحانات بدي أجي أطلبها رسمي"
    أم عسل: "يا ابني الأب عنيد كثير ومتعصب للقومية الكردية. مستحيل يوافق من أول مرة"
    رامي: "بعرف خالة. بس أنا رح حاول. وبوعدك ما رح استسلم"

    وصارت الحياة طبيعية أكثر
    صار في روحات وجيات وطلعات وفوتات بعلم الأم. رامي يفوت يوصل كتب، يطلع يوصل عسل عالمكتبة، يطمن عليها. والأم صارت تقله "تفضل ابني" وصارت تعمله قهوة.

    الهدايا المتبادلة
    كان كل فترة في شي صغير. عطر، كتاب، وردة. بس أهم هدية كانت الخاتم الذهب. ليسته عسل وبكت من الفرح. وبعدها بأسبوع: "خالو ديق علي". تاني يوم كان رامي بالسوق عم يكبره ويبدله بواحد أوسع. "هاد مقاسك وهاد مقاس قلبك عندي"

    اتفاق المستقبل
    بالسهرات صار الكلام بكل ثقة وبكل مكان. بالمكتبة، بالطريق، بالبيت قدام الأم.
    عسل: "إذا أول وحدة بنت شو منسميها؟"
    رامي: "ياسمين... على اسم وادينا"
    عسل: "وإذا ولد؟"
    رامي: "آدم... يكون سندنا كلنا"
    وصاروا يحكوا عن لون البيت، وعن الشغل، وعن كل شي كأنو صار.

    الـ شهرين هدول كانوا أحلى وأصعب شهرين. أحلى لأنو الحب صار عالعلن وقدّام الأم. وأصعب لأنو الكل عارف إنو بعد الامتحانات... في مواجهة مع الأب العنيد مستنية.
    وعد رامي لنفسه: "رح أجيب الشهادة بايدي، وبايدي الثانية رح أطلبها"`
        }, {
            id: 17,
            title: 'الفصل السادس عشر: 06/4 واليومين اللي تغيرت فيهم',
            content: `بداية شهر 6 - 2018

    أول يوم بالامتحانات كان بتاريخ 2018/06/4. رامي وعسل صاحيين من الفجر، متوترين وفرحانين بنفس الوقت.
    رامي: "اليوم بلشنا... خلص قرينا"
    عسل: "ادعلي حبي"

    بنفس اليوم كان في عرس لقرايب عسل. بعد ما خلصت أول مادة، راحت عسل عالعرس وهي فرحانة كثير. لبست، اتصورت، ورقصت. وبعتت لرامي فيديو صغير.
    عسل: "شايفني؟ فرحانة عشانك وعشانا"
    رامي: "الله يحميكي... عقبال فرحتنا"

    تاني يوم رجعت من العرس... بس رجعت غير. من وقت ما رجعت ومعاملتها متغيرة. الكلام قليل، الضحكة خفيفة، في شي شاغل بالها. قعدوا يحكوا بس هي ضلت يومين مو على طبيعتها.
    رامي: "عسل مالك؟ صاير شي بالعرس؟ حدا حكى شي؟"
    عسل: "لا حبي ما في شي... بس تعبانة من الامتحانات"

    بس رامي كان حاسس... في شي. ضل يحاول يعرف شو صاير. يسأل، يطمن، يمزح. بس ما حسّن يطلع منها شي. وقلبه بلش يخاف.`
        }, {
            id: 18,
            title: 'الفصل السابع عشر: الدقيقة اللي غيرت كل شي',
            content: `نص شهر 6 - 2018

    كانت مبسوطة وعم تزمّت على امتحاناتها: "جبت منيح والله" وصلها للمكان اللي متعود يوصله عليه، وباس راسها ومشي على شغله التاني. كان عم يشتغل أكثر من دوام... مشانها. مشان يثبت حاله ويحصل عليها.

    كان عنده درس. بعتها:
    رامي: "حبي أنا فايت ع الدرس"
    عسل: "تمام حبي الله يعطيك العافية"

    خلص الدرس. فتح جواله. لقى رسالة منها بتقطع القلب:
    عسل: "أمي خبرت أبي بالموضوع. أبي رفض رفض قطعي"
    عسل: "أنا ما بحسن أوقف بوجه أهلي بعدني صغيرة. ولما شفت أبي كيف حكاني وما عصب علي ما حسنت أقول شي"

    رامي وقف بالشارع. ايده عم ترجف. رد عليها وهو مو مصدق:
    رامي: "اي شو يعني؟"

    الساعة كانت 3:13 دقيقة.
    هاي الدقيقة أصعب دقيقة بحياته.

    وقات كلمة ما بينساها رامي كل حياتو:
    عسل: "كلشي بيناتنا انتهى"

    في شي كان عم يصير وهنن ما بيعرفوا. في قرار أبوها أخدوه من ورا ضهرهم.`
        }, {
            id: 19,
            title: 'الفصل الثامن عشر: الانكسار',
            content: `وصل الخبر. شخص بقربها تقدم لخطبتها. وأبوها وافق. وقروا الفاتحة.

    وهون رامي مات فعليا.
    عصب. ما عاد يعرف شو يساوي. غلط كثير... كثير. زعجها، ودعا عليها، وبكى، وانقهر. وقعد يفكر: شي انتقام؟ شي خطفة؟ شي يسمح؟ وصار هو بمكان... وهي بعالم تاني.

    بآخر الشهر السادس. انخطبت عسل رسمي. ورامي راح حضر حفل خطوبتها وباركلها. وهو عم يبتسم وقلبه عم ينحرق.

        // ============================================================
        //  RENDER CHAPTERS
        // ============================================================
        const gridContainer = document.getElementById('chaptersGrid');

        function renderChapters() {
            gridContainer.innerHTML = chapters.map((ch, idx) => `
                <div class="chapter-card" data-index="${idx}" role="button" tabindex="0" aria-label="قراءة ${ch.title}">
                    <div class="num">${idx === 0 ? 'م' : idx}</div>
                    <div class="title">${ch.title}</div>
                    <div class="icon-read"><i class="fas fa-chevron-left"></i> اقرأ</div>
                </div>
            `).join('');

            document.querySelectorAll('.chapter-card').forEach(card => {
                card.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    openChapter(idx);
                });
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const idx = parseInt(this.dataset.index);
                        openChapter(idx);
                    }
                });
            });
        }

        // ============================================================
        //  OPEN / CLOSE CHAPTER
        // ============================================================
        const view = document.getElementById('chapterView');
        const viewNum = document.getElementById('viewNum');
        const viewTitle = document.getElementById('viewTitle');
        const viewBody = document.getElementById('viewBody');

        function openChapter(idx) {
            const ch = chapters[idx];
            if (!ch) return;
            viewNum.textContent = idx === 0 ? 'المقدمة' : `الفصل ${idx}`;
            viewTitle.textContent = ch.title;

            const paragraphs = ch.content.split('\n\n').filter(p => p.trim().length > 0);
            let html = '';
            paragraphs.forEach((p, i) => {
                const trimmed = p.trim();
                if (trimmed.length === 0) return;
                if (i === 0) {
                    const firstChar = trimmed.charAt(0);
                    const rest = trimmed.slice(1);
                    html += `<p><span class="first-letter">${firstChar}</span>${rest}</p>`;
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            });
            viewBody.innerHTML = html;
            view.classList.add('active');
            view.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeChapter() {
            view.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  DOWNLOAD PDF
        // ============================================================
        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            const btn = this;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> جاري التحميل...';

            const elementsToHide = document.querySelectorAll('.header .back-btn, .header .chapters-badge, .toolbar, .chapter-view .ch-close, .chapters-grid');
            elementsToHide.forEach(el => el.style.display = 'none');

            const pdfContainer = document.createElement('div');
            pdfContainer.id = 'pdfContainer';
            pdfContainer.style.cssText = 'padding: 30px; background: #fff; color: #000; direction: rtl; font-family: Cairo, sans-serif; max-width: 100%;';

            pdfContainer.innerHTML = `
                <div style="text-align:center; margin-bottom:30px;">
                    <h1 style="font-size:32px; color:#6C3CE1; margin-bottom:5px;">🌅 سكاي لاين</h1>
                    <p style="color:#666; font-size:16px;">قصة حب بين أستاذ وطالبة</p>
                    <p style="color:#999; font-size:14px; margin-top:8px;">رواية للكاتب شادي رحال</p>
                    <hr style="border:1px solid #eee; margin:20px auto; max-width:200px;" />
                </div>
            `;

            chapters.forEach((ch, idx) => {
                const title = idx === 0 ? 'المقدمة' : `الفصل ${idx}`;
                const content = ch.content.replace(/\n/g, '<br>');
                pdfContainer.innerHTML += `
                    <div style="margin-bottom:25px; page-break-inside:avoid;">
                        <h2 style="color:#6C3CE1; font-size:20px; margin-bottom:8px; border-bottom:2px solid #6C3CE1; padding-bottom:8px; display:inline-block;">
                            ${title}: ${ch.title}
                        </h2>
                        <div style="line-height:2.2; font-size:16px; color:#333; margin-top:12px;">${content}</div>
                    </div>
                    <hr style="border:0.5px solid #eee; margin:20px 0;" />
                `;
            });

            pdfContainer.innerHTML += `
                <div style="text-align:center; color:#999; font-size:14px; margin-top:30px; border-top:1px solid #eee; padding-top:20px;">
                    ❤️ جميع الحقوق محفوظة &copy; 2026 شادي رحال ❤️
                </div>
            `;

            document.body.appendChild(pdfContainer);

            const opt = {
                margin: [15, 15, 15, 15],
                filename: 'سكاي_لاين_شادي_رحال.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    letterRendering: true,
                    scrollY: 0,
                    windowHeight: pdfContainer.scrollHeight
                },
                jsPDF: {
                    unit: 'mm',
                    format: 'a4',
                    orientation: 'portrait'
                },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(pdfContainer).save().then(() => {
                elementsToHide.forEach(el => el.style.display = '');
                document.body.removeChild(pdfContainer);
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-file-pdf"></i> تحميل الرواية كـ PDF';
            }).catch(() => {
                elementsToHide.forEach(el => el.style.display = '');
                document.body.removeChild(pdfContainer);
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-file-pdf"></i> تحميل الرواية كـ PDF';
                alert('حدث خطأ أثناء تحميل PDF، يرجى المحاولة مرة أخرى.');
            });
        });

        // ============================================================
        //  INIT
        // ============================================================
        renderChapters();
    </script>
</body>
