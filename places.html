<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>الأماكن - رواية رومانسية للكاتب شادي رحال | تحميل PDF</title>
    <meta name="description" content="رواية الأماكن للكاتب شادي رحال - أربع سنوات من الوفاء والانتظار. اقرأ وحمّل PDF مجاناً." />
    <meta name="keywords" content="الأماكن, رواية الأماكن, شادي رحال, الأماكن PDF, رواية رومانسية, رامي وعسل" />
    <meta name="author" content="شادي رحال" />
    <meta property="og:title" content="الأماكن - شادي رحال" />
    <meta property="og:description" content="رواية الأماكن - أربع سنوات من الوفاء والانتظار" />
    <meta property="og:image" content="https://bahaa90231-art.github.io/-6575/places.jpg" />
    <meta property="og:url" content="https://bahaa90231-art.github.io/-6575/places.html" />
    <meta property="og:type" content="article" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bahaa90231-art.github.io/-6575/places.html" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0A0A0A;
            --bg-elevated: #111111;
            --bg-hover: #1A1A1A;
            --bg-subtle: #161616;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-tertiary: #71717A;
            --primary: #7C3AED;
            --primary-hover: #8B5CF6;
            --primary-subtle: rgba(124, 58, 237, 0.1);
            --gold: #F59E0B;
            --gold-subtle: rgba(245, 158, 11, 0.1);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg: #FAFAFA;
            --bg-elevated: #FFFFFF;
            --bg-hover: #F4F4F5;
            --bg-subtle: #F9F9FA;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.16);
            --text: #09090B;
            --text-secondary: #52525B;
            --text-tertiary: #71717A;
            --primary: #7C3AED;
            --primary-hover: #6D28D9;
            --primary-subtle: rgba(124, 58, 237, 0.08);
            --gold: #D97706;
            --gold-subtle: rgba(217, 119, 6, 0.08);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition), color var(--transition);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: saturate(180%) blur(16px);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            min-height: 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .back-btn:active { transform: scale(0.95); }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-align: center;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }

        .icon-btn:active { transform: scale(0.95); }

        body:not(.light-mode) .theme-toggle .fa-sun { display: none; }
        body.light-mode .theme-toggle .fa-moon { display: none; }

        /* HERO */
        .hero {
            padding: 40px 0 30px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--primary-subtle), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: center;
        }

        .hero-text .novel-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .hero-text h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            background: linear-gradient(180deg, var(--text) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-text p {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }

        .hero-meta {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .hero-meta i { color: var(--primary); }

        .btn-pdf {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
            width: 100%;
        }

        .btn-pdf:active { transform: scale(0.97); }

        .btn-pdf.loading { opacity: 0.7; pointer-events: none; }
        .btn-pdf.loading i { animation: spin 1s linear infinite; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            order: -1;
        }

        .hero-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
        }

        /* CHAPTERS */
        .chapters-section { padding: 24px 0 60px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .section-header .count {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .chapters-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, 1fr);
        }

        .chapter-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 12px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .chapter-card:active {
            transform: scale(0.97);
            background: var(--bg-hover);
        }

        .chapter-card .num {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .chapter-card .title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .chapter-card .arrow {
            font-size: 11px;
            color: var(--text-tertiary);
            transition: all var(--transition);
            margin-top: 2px;
        }

        /* CHAPTER VIEW */
        .chapter-view {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--bg);
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .chapter-view.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chapter-view-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .chapter-view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10;
        }

        .chapter-view-header .title-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .chapter-view-header .ch-num {
            display: inline-block;
            padding: 3px 10px;
            background: var(--primary-subtle);
            color: var(--primary);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            align-self: flex-start;
        }

        .chapter-view-header .ch-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .btn-close:active { transform: scale(0.95); }

        .chapter-body {
            font-size: 16px;
            line-height: 1.95;
            color: var(--text);
            padding-bottom: 60px;
        }

        .chapter-body p { margin-bottom: 1.2rem; }

        .chapter-body .first-letter {
            font-size: 2.8rem;
            font-weight: 800;
            float: right;
            margin-left: 10px;
            margin-top: 4px;
            color: var(--primary);
            line-height: 0.9;
        }

        /* FOOTER */
        .footer {
            border-top: 1px solid var(--border);
            padding: 24px 0 16px;
            background: var(--bg-subtle);
        }

        .footer-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .footer-bottom .copy .author {
            color: var(--text);
            font-weight: 600;
        }

        .dev-credit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .dev-credit i { color: var(--primary); margin-left: 3px; }

        .dev-credit .phone {
            direction: ltr;
            color: var(--text-secondary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* RESPONSIVE */
        @media (min-width: 1400px) {
            .container { padding: 0 40px; }
            .hero { padding: 80px 0 60px; }
            .hero-content { grid-template-columns: 1fr 1fr; gap: 60px; }
            .hero-cover { order: 0; }
            .hero-text h1 { font-size: 56px; }
            .hero-text p { font-size: 16px; }
            .btn-pdf { width: auto; padding: 12px 24px; }
            .chapters-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
            .chapter-card { padding: 18px 16px; }
            .chapter-card .num { font-size: 24px; }
            .chapter-card .title { font-size: 13px; }
            .chapter-body { font-size: 17px; }
        }

        @media (min-width: 900px) and (max-width: 1399px) {
            .hero-content { grid-template-columns: 1fr 1fr; gap: 40px; }
            .hero-cover { order: 0; }
            .hero-text h1 { font-size: 44px; }
            .hero-text p { font-size: 15px; }
            .btn-pdf { width: auto; padding: 12px 24px; }
            .chapters-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        }

        @media (min-width: 600px) and (max-width: 899px) {
            .container { padding: 0 24px; }
            .hero { padding: 40px 0 30px; }
            .hero-content { grid-template-columns: 1fr 1fr; gap: 32px; }
            .hero-cover { order: 0; }
            .hero-text h1 { font-size: 34px; }
            .hero-text p { font-size: 14px; }
            .btn-pdf { width: auto; padding: 10px 20px; font-size: 13px; }
            .chapters-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .chapter-card { padding: 16px 14px; }
            .chapter-card .num { font-size: 22px; }
            .chapter-card .title { font-size: 13px; }
            .chapter-view { padding: 20px; }
            .chapter-body { font-size: 16px; }
            .chapter-view-header .ch-title { font-size: 16px; }
            .footer-bottom { flex-direction: row; justify-content: space-between; text-align: right; font-size: 12px; }
            .dev-credit { flex-direction: row; gap: 16px; }
        }

        @media (min-width: 480px) and (max-width: 599px) {
            .container { padding: 0 20px; }
            .hero-text h1 { font-size: 34px; }
            .hero-text p { font-size: 14px; }
            .chapters-grid { gap: 12px; }
            .chapter-card { padding: 16px 14px; }
            .chapter-card .num { font-size: 22px; }
            .chapter-card .title { font-size: 13px; }
            .chapter-view { padding: 18px; }
            .chapter-body { font-size: 16px; }
        }

        @media (min-width: 375px) and (max-width: 479px) {
            .container { padding: 0 16px; }
            .header-inner { padding: 10px 0; min-height: 56px; }
            .header-title { font-size: 13px; }
            .back-btn { padding: 7px 10px; font-size: 12px; }
            .back-btn span { display: none; }
            .icon-btn { width: 34px; height: 34px; font-size: 13px; }
            .hero { padding: 24px 0 20px; }
            .hero-content { gap: 20px; }
            .hero-text h1 { font-size: 28px; }
            .hero-text p { font-size: 13px; }
            .hero-meta { font-size: 11px; gap: 12px; }
            .btn-pdf { padding: 11px 18px; font-size: 13px; }
            .chapters-section { padding: 20px 0 50px; }
            .section-header h2 { font-size: 16px; }
            .chapters-grid { gap: 10px; }
            .chapter-card { padding: 14px 12px; }
            .chapter-card .num { font-size: 20px; }
            .chapter-card .title { font-size: 12px; }
            .chapter-view { padding: 14px; }
            .chapter-view-header { padding: 10px 0; margin-bottom: 18px; }
            .chapter-view-header .ch-title { font-size: 13px; }
            .chapter-body { font-size: 15px; line-height: 1.9; }
            .chapter-body .first-letter { font-size: 2.4rem; }
            .btn-close span { display: none; }
            .footer { padding: 20px 0 12px; }
        }

        @media (max-width: 374px) {
            .container { padding: 0 12px; }
            .header-inner { padding: 8px 0; min-height: 52px; }
            .header-title { font-size: 12px; }
            .back-btn { padding: 6px 8px; font-size: 11px; }
            .icon-btn { width: 32px; height: 32px; font-size: 12px; }
            .hero { padding: 20px 0 16px; }
            .hero-content { gap: 16px; }
            .hero-text h1 { font-size: 24px; }
            .hero-text p { font-size: 12px; }
            .hero-meta { font-size: 10px; gap: 10px; }
            .hero-text .novel-tag { font-size: 10px; padding: 4px 10px; }
            .btn-pdf { padding: 10px 16px; font-size: 12px; }
            .chapters-section { padding: 16px 0 40px; }
            .section-header h2 { font-size: 15px; }
            .chapters-grid { gap: 8px; }
            .chapter-card { padding: 12px 10px; }
            .chapter-card .num { font-size: 18px; }
            .chapter-card .title { font-size: 11px; }
            .chapter-view { padding: 12px; }
            .chapter-view-header .ch-title { font-size: 12px; }
            .chapter-body { font-size: 14px; line-height: 1.85; }
            .chapter-body .first-letter { font-size: 2.2rem; }
            .footer-bottom { font-size: 10px; }
        }

        @media (hover: none) and (pointer: coarse) {
            .chapter-card:hover { border-color: var(--border); box-shadow: none; transform: none; }
            .icon-btn:hover { background: transparent; color: var(--text-secondary); border-color: var(--border); }
            .back-btn:hover { background: transparent; color: var(--text-secondary); border-color: var(--border); }
            .btn-close:hover { background: transparent; color: var(--text-secondary); border-color: var(--border); }
            .btn-pdf:hover { background: var(--primary); transform: none; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-right"></i>
                    <span>العودة</span>
                </a>
                <div class="header-title">الأماكن</div>
                <div class="header-actions">
                    <button class="icon-btn theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-cover">
                    <img src="places.jpg" alt="غلاف الأماكن" onerror="this.style.display='none'" />
                </div>
                <div class="hero-text">
                    <span class="novel-tag">
                        <i class="fas fa-heart"></i>
                        رواية رومانسية
                    </span>
                    <h1>الأماكن</h1>
                    <p>
                        أربع سنوات من الوفاء والانتظار. رحلة عبر الأماكن التي شهدت حباً لا يموت،
                        ومواجهة مع الزمن والذكريات.
                    </p>
                    <div class="hero-meta">
                        <span><i class="fas fa-book"></i> 13 فصلاً</span>
                        <span><i class="fas fa-user"></i> شادي رحال</span>
                        <span><i class="fas fa-clock"></i> قراءة 1.5 ساعة</span>
                    </div>
                    <button class="btn-pdf" id="downloadPdfBtn">
                        <i class="fas fa-file-pdf"></i>
                        <span>تحميل PDF</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- CHAPTERS -->
    <section class="chapters-section">
        <div class="container">
            <div class="section-header">
                <h2>الفصول</h2>

        // RENDER
        const gridContainer = document.getElementById('chaptersGrid');

        function renderChapters() {
            gridContainer.innerHTML = chapters.map((ch) => `
                <div class="chapter-card" data-id="${ch.id}" role="button" tabindex="0">
                    <div class="num">${ch.id}</div>
                    <div class="title">${ch.title}</div>
                    <i class="fas fa-arrow-left arrow"></i>
                </div>
            `).join('');

            document.querySelectorAll('.chapter-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    openChapter(id);
                });
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const id = parseInt(this.dataset.id);
                        openChapter(id);
                    }
                });
            });
        }

        // OPEN / CLOSE
        const view = document.getElementById('chapterView');
        const viewNum = document.getElementById('viewNum');
        const viewTitle = document.getElementById('viewTitle');
        const viewBody = document.getElementById('viewBody');

        function openChapter(id) {
            const ch = chapters.find(c => c.id === id);
            if (!ch) return;
            viewNum.textContent = `الفصل ${ch.id}`;
            viewTitle.textContent = ch.title;

            const paragraphs = ch.content.split('\n\n').filter(p => p.trim().length > 0);
            let html = '';
            paragraphs.forEach((p, i) => {
                const trimmed = p.trim();
                if (trimmed.length === 0) return;
                if (i === 0) {
                    const firstChar = trimmed.charAt(0);
                    const rest = trimmed.slice(1);
                    html += `<p><span class="first-letter">${firstChar}</span>${rest}</p>`;
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            });
            viewBody.innerHTML = html;
            view.classList.add('active');
            document.body.style.overflow = 'hidden';
            history.pushState({ id }, '', `#chapter-${id}`);
            view.scrollTop = 0;
        }

        function closeChapter() {
            view.classList.remove('active');
            document.body.style.overflow = '';
            history.pushState({}, '', window.location.pathname);
        }

        window.addEventListener('popstate', function() {
            if (view.classList.contains('active')) {
                view.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        window.addEventListener('load', function() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#chapter-')) {
                const id = parseInt(hash.replace('#chapter-', ''));
                if (!isNaN(id) && chapters.find(c => c.id === id)) {
                    setTimeout(() => openChapter(id), 100);
                }
            }
        });
