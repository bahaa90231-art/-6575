<head>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <style>
        /* ============================================================
           ROOT & RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --primary-dark: #4F29A8;
            --gold: #F59E0B;
            --gold-light: #FBBF24;
            --bg: #07050E;
            --bg-card: #110B1F;
            --bg-card-hover: #1A122E;
            --text: #F3F0FF;
            --text-muted: #9CA3AF;
            --glass: rgba(17, 11, 31, 0.7);
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================================
           ANIMATED BACKGROUND ORBS
           ============================================================ */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--primary);
            top: -200px;
            right: -150px;
            opacity: 0.2;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--gold);
            bottom: -150px;
            left: -100px;
            opacity: 0.15;
            animation-delay: 6s;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: var(--primary-light);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            animation-delay: 12s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -60px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 40px) scale(0.95);
            }
            100% {
                transform: translate(50px, -30px) scale(1.05);
            }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(108, 60, 225, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108, 60, 225, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header .back-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 60px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .header .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateX(-4px);
        }

        .header .title-section {
            text-align: center;
            flex: 1;
        }

        .header .title-section h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .title-section .sub {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .header .title-section .sub i {
            color: var(--gold);
        }

        .header .chapters-badge {
            background: var(--primary);
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(108, 60, 225, 0.3);
            white-space: nowrap;
        }

        /* ============================================================
           NOVEL COVER
           ============================================================ */
        .novel-cover {
            width: 100%;
            max-height: 400px;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: var(--bg-card);
        }

        .novel-cover img {
            width: 100%;
            height: 100%;
            max-height: 400px;
            object-fit: cover;
            display: block;
        }

        /* ============================================================
           TOOLBAR
           ============================================================ */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .toolbar .btn-pdf {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 60px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar .btn-pdf:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(220, 38, 38, 0.45);
        }

        .toolbar .btn-pdf i {
            font-size: 1.1rem;
        }

        .toolbar .btn-pdf.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .toolbar .btn-pdf.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           CHAPTERS GRID
           ============================================================ */
        .chapters-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .chapter-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .chapter-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }

        .chapter-card .num {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .chapter-card .title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text);
        }

        .chapter-card .icon-read {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.75rem;
            opacity: 0;
            transition: var(--transition);
        }

        .chapter-card:hover .icon-read {
            opacity: 1;
            color: var(--gold);
        }

        /* ============================================================
           CHAPTER VIEW
           ============================================================ */
        .chapter-view {
            display: none;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 35px 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: var(--shadow);
            margin-top: 25px;
            animation: fadeUp 0.4s ease;
        }

        .chapter-view.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chapter-view .ch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .chapter-view .ch-header .ch-num {
            background: var(--primary);
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .chapter-view .ch-header .ch-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chapter-view .ch-header .ch-close {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .chapter-view .ch-header .ch-close:hover {
            border-color: var(--gold);
            color: var(--text);
        }

        .chapter-view .ch-body {
            font-size: 1.05rem;
            line-height: 2.1;
            color: var(--text);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .chapter-view .ch-body p {
            margin-bottom: 1.2rem;
        }

        .chapter-view .ch-body .first-letter {
            font-size: 3.2rem;
            font-weight: 900;
            float: right;
            margin-left: 12px;
            margin-top: 4px;
            color: var(--gold);
            line-height: 1;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .footer .heart {
            color: var(--gold);
        }

        .footer .author-name {
            color: var(--primary-light);
            font-weight: 700;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .container {
                padding: 12px 12px 70px;
            }
            .header {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }
            .header .title-section h1 {
                font-size: 1.5rem;
            }
            .novel-cover {
                max-height: 250px;
            }
            .novel-cover img {
                max-height: 250px;
            }
            .chapters-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .chapter-view {
                padding: 20px 16px;
            }
            .chapter-view .ch-header .ch-title {
                font-size: 1.2rem;
            }
            .chapter-view .ch-body {
                font-size: 0.95rem;
                line-height: 1.9;
            }
            .toolbar .btn-pdf {
                padding: 10px 22px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .chapters-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .chapter-card {
                padding: 14px 10px;
            }
            .chapter-card .num {
                font-size: 1.8rem;
            }
            .chapter-card .title {
                font-size: 0.8rem;
            }
            .header .title-section h1 {
                font-size: 1.2rem;
            }
            .header .chapters-badge {
                font-size: 0.7rem;
                padding: 4px 14px;
            }
            .novel-cover {
                max-height: 180px;
            }
            .novel-cover img {
                max-height: 180px;
            }
            .chapter-view {
                padding: 16px 12px;
            }
            .chapter-view .ch-header .ch-title {
                font-size: 1rem;
            }
            .chapter-view .ch-body {
                font-size: 0.85rem;
                line-height: 1.8;
            }
            .toolbar .btn-pdf {
                padding: 8px 16px;
                font-size: 0.75rem;
                gap: 6px;
            }
            .toolbar .btn-pdf i {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <!-- ============================================================
        HEADER
        ============================================================ -->
        <div class="header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-right"></i> العودة
            </a>
            <div class="title-section">
                <h1>🏛️ الأماكن</h1>
                <div class="sub"><i class="fas fa-quote-right"></i> أربع سنوات من الوفاء والانتظار <i class="fas fa-quote-left"></i></div>
            </div>
            <div class="chapters-badge"><i class="fas fa-book"></i> 13 فصلاً</div>
        </div>

        <!-- ============================================================
        COVER
        ============================================================ -->
        <div class="novel-cover">
            <img src="places.jpg" alt="الأماكن - غلاف الرواية" onerror="this.style.display='none'" />
        </div>

        <!-- ============================================================
        TOOLBAR
        ============================================================ -->
        <div class="toolbar">
            <button class="btn-pdf" id="downloadPdfBtn">
                <i class="fas fa-file-pdf"></i>
                تحميل الرواية كـ PDF
            </button>
        </div>

        <!-- ============================================================
        CHAPTERS
        ============================================================ -->
        <div class="chapters-grid" id="chaptersGrid"></div>

        <!-- ============================================================
        CHAPTER VIEW
        ============================================================ -->
        <div class="chapter-view" id="chapterView">
            <div class="ch-header">
                <span class="ch-num" id="viewNum">الفصل 1</span>

        </div>
    </div>

    <script>
        // ============================================================
        //  DATA - جميع فصول رواية الأماكن (13 فصلاً)
        // ============================================================
        const chapters = [{
            id: 1,
            title: 'الفصل الأول: كنت صغيرة',
            content: `بعد 4 سنين. معهد سكاي الين لساته بنفس المكان بوادي الياسمين. نفس الباب، نفس السبورة، بس الطالب تغيروا. الكراسي تغيرت. بس أول طاولتين... لساتهم فاضيين. رامي ما خال حدا يقعد فيهم من يوم راحت.

    الساعة 8:03. الصف مليان، الكل عم يكتب. انفتح الباب بهدوء. فوتت وحدة البسة حجاب أبيض، شنطة شغل، وريحتها نفس ريحة الورد الأبيض. الكل لف. عسل. بس مو عسل تبع 2017. هاي وحدة تانية. أضحى، أهدى، وعيونها فيها ثقة.

    رامي شافها وقلبه دق مثل أول يوم. القلم وقع من ايده. بس بسرعة رجع أستاذ قدام طالبه.
    رامي: "أهلا أئسة عسل. تفضلي."
    عسل: "أهلا أستاذ. أسفة قطعت الدرس، كنت مارقة من هون وحبيت سلم."
    قعدت بآخر طاولة. هي بتعرف انو أول طاولتين إليهم حرمة.

    كمل الدرس. بس هالمرة بالعكس. كل ما يشرح قاعدة، عينه بتروح لآخر طاولة. الحصة اللي كانت ناقصة لما تغيب، رجعت كاملة لما رجعت.

    خلص الدرس. الطلاب طلعوا واحد ورا واحد. ضحك، دفاتر، "يعطيك العافية أستاذ". الصف فضى. المعهد فاضي. 2017/12/15 ضل هو وهي لحالهم. نفس مشهد. سكر الباب بهدوء. قعد على أول طاولة مقابيلها. ترك بيناتهم 4 صفوف احترام. 10 ثواني سكتوا. 10 ثواني كانوا 4 سنين.

    عسل: "ليش ما اتزوجت؟"
    رامي: "كنت عم استنى 3:14. وانتى؟"
    عسل: "انخطبت 8 شهور وفسخت. ما قدرت."
    قامت من آخر طاولة واجت على تاني طاولة. قربت.
    "جيت قلك شي ما قدرت قلك ياه بـ 2018. كنت صغيرة وخفت. بتتذكر اليومين اللي تغيرت فيهم بعد العرس؟ بالعرس اجت خالتي وقالتلي قدام الكل: شو بدك بهاد الأستاذ العربي الكبير؟ بكرا بياخدك وبينسي أصل. أبوك رح يتبرا منك. خوفتني. حسيت حالي لحالي. انت كنت بعيد عم تشتغل مشاني، وأنا كنت بالنص بين أهلي وقلبي. واخترت أهلي لأنو كنت صغيرة. كنت مفكرة الحب بيروح... ما كنت بعرف انو بيضل 4 سنين بنفس الطاولة".

    رامي سمعها للآخر. ما قاطعها.
    رامي: "وجملة كلشي بيناتنا انتهى الساعة 3:13"
    عسل: "كتبتها وأمي فوق راسي. قالتلي اكتبيها وخلصينا. كتبتها وأنا عم ارجف. مو لأنو انتي. لأنو ما عرفت شو اكتب غيرها".

    مدت. قام رامي فتح الدرج. نفس الدرج. طالع علبة صغيرة قديمة. فتحها. الخاتم الذهب.
    رامي: "ساتها عندي. ما كبرته. خليته نفس المقاس. قلت لحالي إذا رجعت وهي قوية... مقاسها رح يكون لحاله."
    ما لبسها ياه. حطه عالطاولة بالنص بيناتهم.
    رامي: "أنا ما رح قلك ارجعي. انتي هال مو البنت القصيرة اللي بدها مين يقرر عنها. انتي أنسة عسل، الأولى عالدفعة، المتخرجة. إذا بدك تلبسيه... باب قلبي لساته مفتوح. نفس الباب اللي كتبت عنه بالمقدمة. في أبواب إذا انفتحت بتتسكر لأبد... وفي باب تركته مفتوح 4 سنين ناظر صاحبه يرجع."

    عملت مدت ايدها. ما ليست الخاتم. سكرت العلبة وحطتها بشنطتها.
    عسل: "رح أخده معي. بس ما رح البسه هلا. رح البسه لما أجي المرة الجاية ومعي أمي. لأنو هالمرة بدي هي تقلك الجملة اللي قالتها أول مرة: يا ريت يكون عندي صهر مثل أستاذها."

    وقفت عند الباب. التفتت وقالت نفس جملتها تبع أول مرة جابتله فيها الكيك: "كل سنة وانت بخير. انت بتستاهل."
    وطلعت. ضل رامي قاعد لحاله بأول طاولتين. بس هالمرة مو موجود مبتسم. لأنو أول مرة من 4 سنين ...الساعة صارت 3:14.`
        }, {
            id: 2,
            title: 'الفصل الثاني: عند أبوها',
            content: `تاني يوم. الساعة 4 العصر. رامي واقف قدام بيت ما دخله من 4 سنين. نفس الحارة، نفس الباب الحديد. ايده فيها نفس علبة الخاتم، بس فاضية. لأنو الخاتم معها. وايده التانية فيها كيس فاكهة. لأنو هيك علموه أهله: فوت على بيت الناس كبير حتى لو هنن صغروك.

    دق الباب. فتحت أم عسل. شافته وعرفته فورا.
    أم عسل: "أستاذ رامي؟"
    رامي: "مرحبا خالة. عسل موجودة؟"
    سكتت شوي وبعدين قالت بصوت واطي: "جوا... بس أبوها جوا".
    رامي: "جاي مشانه هو".
    فات.

    بالبسة بدلة كردية. قام فتح الدرج وطالع صورة قديمة. صورة عسل وهي صغيرة بالابتدائي،
    أبو عسل: "بتعرف ليش كنت عنيد؟ لأنو أنا كردي وانت عربي. وأنا شفت بعيني شو عملت السياسة فينا. كنت مفكر انت رح تاخدها وتنساها وتنسى أصلها. كنت مفكر رح تضيع. بس من 8 شهور... لما فسخت خطبتها من ابن خالتها الكردي... قالتلي جملة واحدة: بابا انت اخترتلي قوميتي بس ما اخترتلي قلبي. وأنا بدي الاتنين. ساعتها فهمت إني كنت غلطان."

    قرب أبوها وحط ايده على كتف رامي.
    أبو عسل: "روح يا ابني. قلها أبوكي موافق يشوف قوميتها بعيون والدها... حتى لو أبوه مش عربي."

    بهاللحظة... فاتت عسل من جوا. كانت سامعة كل شي. مو البسة الخاتم. ماسكته بايدها. ولأول مرة من 4 سنين، ليسته قدام أبوها. وكان على مقاسها تماما.`
        }, {
            id: 3,
            title: 'الفصل الثالث: وبرجع للواقع',
            content: `خلص الخيال. فتح رامي عيونه. هو لساته قاعد بنفس المعهد. الساعة 3:14 عنجد. بس الصف فاضي عنجد. ما في عسل، ما في أبوها، ما في خاتم على مقاسها. العلبة الفاضية لساتها بالدرج. مغبرة.

    قام غسل وشه. حط مي باردة. وضحك لحاله:
    "ولك رامي ...شفت شلون خيالك حلو؟ بتحل كل شي بدقيقتين. بتروح لعند أبوها، بيقلك ابني، بتلبس الخاتم... بالواقع القصة بدها 4 سنين تانية".

    فتح دفتره وكتب تحت آخر صفحة من الفصل التاني:
    تنويه للقارئ: كل شي قريته فوق هو خيال. خيال كتبته لأنو الواقع وجعني. بالواقع عسل تزوجت وأنا لساتني أستاذ وأبوها لساته عنيد. وما صار المواجهة ولا الخاتم.

    بس الخيال مو كذب. الخيال هو البروفة. هو تدريب القلب مشان إذا اجا يوم وصار عنجد... نكون جاهزين وما نخاف.

    فإذا كنت عم تقرا هالسطر وانت متلي... عم تتخيل حدا راح... تذكر: تتخيله مو ضعف. تتخيله معناها لساتك بتحب. والحب اللي بيضل 4 سنين بخيالك... هو نفسه الحب اللي بيستاهل ينكتب.

    سكر الدفتر. وطلع من المعهد. وادي الياسمين فاضي. بس القمر فوقه. نفس القمر تبع 2017. وأول مرة ما قال: "ليتني لم أكبر." قال: "ليتني أضل أتخيل...لحتى يصير الخيال واقع".`
        }, {
            id: 4,
            title: 'الفصل الرابع: الطالب القديم',
            content: `الطالب القديم: "أستاذ لسائك تارك مكان عسل فاضي؟"
    رامي (بصوت واطي): "اي."
    الطالب: "ما حدا بيعرف قصتها غيرنا نحنا القدامى."
    رامي: "وما لازم حدا يعرف. بتضل بيناتنا. الطالب الجداد بينفكروا اني تاركهم احتياط. خليهم يفكروا هيك أحسن."

    رجع على الصف. مسح السبورة. وطالع بأول طاولتين وقال جواته، مو بصوت عالي:
    لسائك الأولى. ولما مكانك محجوز. ما حدا بياخده. لا اليوم ولا بعد 10 سنين. لأنو في ناس بتنحجز بقلب الواحد مو بطاولة.

    وبآخر الدوام، بعد ما راحوا كل الطالب، ضل لحاله بالصف. جاب كرسي وقعد قبال أول طاولتين. وفتح دفتر المذكرات وكتب:
    اليوم 15 طالب جديد حاولوا يقعدوا مكانك. وما خليت حدا. مو لأنك كنتي طالبة شاطرة بس. لأنك كنتي انتي وبس.

    سكر الدفتر وطفا الضو وطلع. وأول طاولتين ضلوا فاضيين. نضاف. محجوزين. بصمت.`
        }, {
            id: 5,
            title: 'الفصل الخامس: مفتشة',
            content: `حصة تعارف. أول حصة بكل كورس جديد. رامي متعود يسأل نفس السؤال كل سنة:
    رامي: "كل واحد يقلي شو بده يصير بس يكبر".

    الطالب بلشوا: "دكتور"، "مهندس"، "أستاذ متلك"، "ضابط".
    وصل الدور لبنت قاعدة بآخر الصف. البسة حجاب أبيض. قصيرة. مو كتير بس قصيرة.
    البنت (بخجل): "أنا بدي صير مفتشة".

    الطبشورة وقعت من ايد رامي. صوت الطبشورة وهي عم توقع كان عالي كتير. الصف كله تطلع فيه.
    نفس الجملة. نفس الكلمة. نفس الطريقة. من 4 سنين. عسل كانت تقعد بأول طاولتين وتقول: "أنا بدي صير مفتشة. بدي فتش على الحق".

    وهلق بنت تانية بنفس الحجاب الأبيض عم تقول نفس الحلم. رامي ما حكى شي قدام الطالب. ما بيصير. هو أستاذ.
    مسك الطبشورة عن الأرض بهدوء. وقال بصوت طبيعي:
    رامي: "مفتشة؟ حلو. بدها دراسة كتير."

    كمل يسأل باقي الطالب. كأنه ما صار شي. بس جواته...
    جواته رجع ل 2017. عسل قاعدة بأول طاولة، عم تقله: "أستاذ بكرا إذا صرت مفتشة رح فتش على كل المدارس وشوف إذا الأساتذة عم يدرّسوا من قلبهم متلك ولا لا".

    كان يضحك عليها ويقلها: "انتي قصيرة، المفتشة لازم تكون طويلة مشان تهز بدن المدير."
    كانت ترد: "الطول مو بالسنتيمتر أستاذ. الطول بالحق."

    خلصت الحصة. الطالب طلعوا. البنت اللي قالت مفتشة ضلت واقفة قدام الطاولة.
    البنت: "أستاذ ليش استغربت لما قلت مفتشة؟"
    رامي (حاول يكون طبيعي): "لا ما استغربت. ذكرتيني بطالبة قديمة كانت عندي. أشطر طالبة درستها. كان نفس حلمها."
    البنت: "وصارت مفتشة؟"
    سكت رامي. طلع على أول طاولتين الفاضيين.`
        }, {
            id: 6,
            title: 'الفصل السادس: الطاولة رقم 7',
            content: `نفس الشباك الصغير اللي بيطل على الشارع. نفس الكرسيين الحديد. نفس الطاولة. هون. بهالطاولة بالضبط. قعد هو وعسل بآخر مرة كانوا فيها مناح مع بعض. 2018. كانوا يحبوا بعض. كتير. وكانوا عم يخططوا مستقبلهم. لبيتهم. لولادهم. كانوا راسمين كل شي على محرمة ورق تبع المطعم. بيت وولاد وحياة كاملة. كانوا يضحكوا ويقولوا: "رح نعمل هيك ورح نعمل هيك". كل الحكي اللي انحكى على هالطاولة كان حب ومستقبل.

    هلق هو واقف قدامها. والشلة وراه.
    أحمد: "شو واقفت؟ يلا قعود".
    رامي هز راسه.
    رامي: "ما بدي هون. في هوا من الشباك. خلونا نقعد جوا أكثر".
    ما قال انها طاولة عسل. ما جاب سيرتها قدام حدا. هاد وجعه لحاله.

    قعدوا على طاولة تانية بعيدة. طول القعدة الشباب عم يحكوا وهو ساكت. كل شوي عينه بتسرق نظرة على الطاولة رقم 7. شايفها فاضية. شايف الكرسي اللي كانت قاعدة عليه عسل فاضي. شايف المحرمة الورق اللي كانوا مخططين عليها... مو موجودة. شالوها من زمان. حس قلبه تقل. كتير.`
        }, {
            id: 7,
            title: 'الفصل السابع: نفس اللغة',
            content: `تاني وقفة، المكتبة الصغيرة عالطريق. بيوقف ثواني قدامها. هون اشتريلها القلم الأزرق اللي لساته بجييته للهلق.

    أول وقفة عالمعهد. بيفوت عالصف الفاضي. بيمسح أول طاولتين. بيعقد دقيقتين مكانها. نفس الريحة، نفس الذكرى.

    تاني وقفة، المكتبة الصغيرة عالطريق. بيوقف ثواني قدامها. هون اشتريلها القلم الأزرق اللي لساته بجييته للهلق.

    تالت وقفة، الحديقة. نفس الكرسي. نفس الضحكة اللي ضحكتها بصوت عالي وخلت كل الناس تطلع فيهن. هلق بيضحك لحاله، والناس بتطلع فيه لأنه عم يضحك لحاله.

    وآخر وقفة... المطعم. ما بيفوت لجوا. السور تبع المطعم بيوقف برا ورا الشباك. بيطلع من بعيد على الطاولة رقم 7. صارت معروفة لحالها. الجرسون صار يعرفه. ما عاد يقله تفضل، بس يهزله راسه. لأنه عرف انه مو جاي ياكل، جاي يزور ذكرى. خمس دقايق واقف، ايده بجييه ماسك المحرمة المطوية. ويرجع عالبيت.

    نفس اللغة. كل يوم. كأنه عم يقول لكل الأماكن: انا لساتني هون، بنفس الطريق، ناظر ترجع تمشي معي.`
        }, {
            id: 8,
            title: 'الفصل الثامن: المحرمة',
            content: `نفس اللغة. مثل كل يوم، من أربع سنين لهلق. المعهد. بيفوت، بيمسح أول طاولتين، بيعقد دقيقة مكانها ويبطلع. المكتبة. بيوقف قدامها، بيتذكر لما اشتريلها القلم الأزرق وكيف قالثلو "ما كان في داعي"، وهي عيونها عم يلمعوا.

    الحديقة. نفس الكرسي. بيقعد، بيطالع السما، بيتذكر ضحكتها العالية اللي كانت تحرجها وتخليه يضحك أكثر.

    وهو طالع من الحديقة، رابح آخر محطة، لعند الطاولة رقم 7، سمع صوت من وراه:
    "استاذ رامي؟"
    لف بسرعة. قلبه صار يدق بسرعة كأنه رجع لورا سنة.
    كانت هي. رفيقتها. أقرب رفيقة لها. اللي كانت دايماً التالتة تبعهم، اللي كانت تعرف انه بيحبها قبل ما هو يعترف لحاله.
    "أهلي" قلها. صوته كان رايح.

    سكتت. طلعت يمين وشمال. وبعدين قالت بنفس واحد، كأنها خايفة إذا وقفت ما عاد تقدر تكمل:
    "بدي قلك شغلة قبل ما تسمعها من برا... مشان انت... انت غير."
    هو فهم. بس ما حكى.
    "عسل... شالت الحجاب من شهرين تقريبا."
    رامي ما تحرك. بس ايده نزلت على جيبه لحالها، مسكت المحرمة المطوية. شد عليها.

    سكتت شوي وكملت الكلمة الأصعب:
    "وعرسها بعد شهرين. خطبوها ابن خالتها اللي بالضيعة متل ما بتعرف. رح تسكن بالضيعة".

    الكلمة الأخيرة "رح تسكن بالضيعة" كانت أضرب من كلمة "عرسها."
    رامي ضل واقف. الناس عم تمشي حواليه والد عم يركضوا، بالحديقة صوت سيارات... كلشي عم يتحرك طبيعي إلا هو.
    "هي موافقة؟" سألها.
    الرفيقة نزلت راسها. "ما بعرف شو بدي قلك. هي بتقول اي. بس انا رفيقتها وبعرفها...هي عم تقول اي لكلشي من وقت ما انت رحت".
    ما عرف شو يرد.
    رفيقتها مسكت ايده ثانية وتركتها بسرعة. "حبيت قلك انت بالذات. لأنه بعرف شو كنتو لبعض. وبعرف انك لساتك بتمرق من هون كل يوم مشانها. ما كان بدي تنصدم قدام الكل".
    قالتله "للا يكون معك استاذ" وراحت.
    وهو ضل واقف لحاله بنص الطريق. بين الحديقة اللي فيها كرسيهن وبين الشباك اللي وراه الطاولة رقم 7.
    أول مرة من أربع سنين، ما كمل اللفة. ما راح آخر محطة. برم وحط ايديه بجيوبه ورجع عالبيت. خطواته تقيلة. والمحرمة بجيبه... بس هالمرة ما كانت ذكرى حلوة. كانت تقيلة، كأنها عم تذكره انه كلشي كتبوه عليها انمسح.

    وصل عالبيت. فات على غرفته. ما ضوى الضو. وطالع المحرمة، فتحها وقراها للمرة الألف:
    "نحنا لبعض كل العمر و رح نكمل سوا للآخر"
    وأول مرة حس انه هو لساته ماسك الكلمة... بس "الآخر" تبعها اجا.`
        }, {
            id: 9,
            title: 'الفصل التاسع: المواجهة',
            content: `تاني يوم ما عمل اللفة. ما راح عالمعهد. ما مر عالمكتبة. ما قعد بالحديقة. وما وقف ورا الشباك عند الطاولة رقم 7. ضل بغرفته للعصر. والمحرمة قدامه عالطاولة. مفتوحة.
    "نحنا لبعض كل العمر و رح نكمل سوا للآخر"

    كان عم يفكر بكلمة رفيقتها: "رح تسكن بالضيعة".
    قام فجأة. لبس وطلع. راح لعند حارتها. الحارة اللي كان يتجنبها من أربع سنين كاملة مشان ما يقولوا عم يراقبها. وقف بعيد. عند الدكانة اللي على أول الحارة. صار يستنى.

    ساعة. ساعتين. الشمس بلشت تغيب. كان كل شوي يقول لحاله "قوم روح، شو جاي تعمل هون"، ويرجع يقول "مرة أخيرة بس". وفجأة انفتح باب بيتهن. طلعت هي. شعرها باين. لابسة بلوزة غير اللي متعود عليها. وماسكة موبايلها وعم تضحك. مو نفس البنت اللي كانت تستحي ترفع صوتها بالصف. مو نفس البنت اللي كانت تشد حجابها كل شوي.

    رامي تجمد ورا الدكانة. هي مشت شوي، وقفت سيارة، ركبت فيها وراحت. ما شافته. وهو ضل واقف. ما زعل لأنها شالت الحجاب. ولا زعل لأنها رايحة. زعل لأنه حسها مبسوطة بدونه. حس انه هو الوحيد اللي لساته واقف بنفس المكان. رجع عالبيت بالليل. ماشي لحاله. فات على غرفته، سكر الباب. طالع المحرمة، وشمها. لساتها نفس الريحة. ريحة الحديقة والقلم الأزرق والورق القديم. وأول مرة من أربع سنين، ما حطها بجيبه. تركها عالطاولة، وفتح الشباك، وضل سهران عم يطلع عالسما الفاضية.`
        }, {
            id: 10,
            title: 'الفصل العاشر: رجع يتخيل',
            content: `أربع سنين. مو سنة. أربع سنين وهو بيعمل نفس اللغة كل يوم. بعد ما شافها طالعة من بيتها بشعرها وراكبة السيارة ورايحة، بطل يطلع يومين. سكر على حاله بالغرفة. أمه تفوت تحطله أكل وتطلع، ما يحكي ولا كلمة. المحرمة قدامه عالطاولة، مفتوحة، وعليها العبارة بخطها اللي حافظه أكثر من خطه هو:
    "نحنا لبعض كل العمر و رح نكمل سوا للآخر"
    كل العمر... قال كل العمر. وخلص كل العمر بعد أربع سنين.

    باليوم الثالث، ما قدر يضل. الساعة 2 بالليل، لبس وطلع. الدنيا فاضية وبرد.
    أول محطة، المعهد. مسكر. وقف قدام الباب الحديد. تذكر أول مرة شافها هنيك. كانت جديدة، ضايعة، وهو دلها على صفها. تخيل الباب انفتح وطلعت هي، بنفس الحجاب القديم، عم تقله: "استاذ لسائك بتتأخر مثل العادة؟" ضحك لحاله. ضحكة بتوجع.

    تاني محطة، المكتبة. مسكرة. بس الضو جوا كان مبين. وقف ورا البلور. تخيلها جوا، عم تقلب الدفاتر، ورفعت راسها وشافته. أشرتله بايدها "تعال". هو أشرلها "لا، خليكي".

    تالت محطة، الحديقة. أهم محطة. الكرسي فاضي، عليه ندى. راح قعد. الطقس بارد، بس هو مو حاسس. طالع المحرمة من جيبه. فتحها. قراها بصوت عالي، بالحديقة الفاضية الساعة 2 ونص بالليل:
    "نحنا لبعض كل العمر و رح نكمل سوا للآخر"
    "كل العمر طلع أربع سنين يا عسل؟" قالها للكرسي الفاضي. "أنا كنت مفكر كل العمر يعني منّوت سوا."

        const view = document.getElementById('chapterView');

        const viewTitle = document.getElementById('viewTitle');
        const viewBody = document.getElementById('viewBody');

        function openChapter(id) {
            const ch = chapters.find(c => c.id === id);
            if (!ch) return;
            viewNum.textContent = `الفصل ${ch.id}`;
            viewTitle.textContent = ch.title;

            const paragraphs = ch.content.split('\n\n').filter(p => p.trim().length > 0);
            let html = '';
            paragraphs.forEach((p, i) => {
                const trimmed = p.trim();
                if (trimmed.length === 0) return;
                if (i === 0) {
                    const firstChar = trimmed.charAt(0);
                    const rest = trimmed.slice(1);
                    html += `<p><span class="first-letter">${firstChar}</span>${rest}</p>`;
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            });
            viewBody.innerHTML = html;
            view.classList.add('active');
            view.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeChapter() {
            view.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

                btn.innerHTML = '<i class="fas fa-file-pdf"></i> تحميل الرواية كـ PDF';
                alert('حدث خطأ أثناء تحميل PDF، يرجى المحاولة مرة أخرى.');
            });
        });
