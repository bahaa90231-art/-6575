<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>روايات الكاتب شادي رحال - مكتبة عربية احترافية</title>
    <meta name="description" content="مكتبة روايات عربية احترافية للكاتب شادي رحال: سكاي لاين، الأماكن، ماذا لو ما كانت الحرب؟ - اقرأ وحمّل PDF مجاناً." />
    <meta name="keywords" content="روايات, شادي رحال, سكاي لاين, الأماكن, ماذا لو ما كانت الحرب, روايات عربية, تحميل روايات PDF" />
    <meta name="author" content="شادي رحال" />
    <meta property="og:title" content="روايات الكاتب شادي رحال" />
    <meta property="og:description" content="مكتبة روايات عربية احترافية - اقرأ وتحميل مجاني" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bahaa90231-art.github.io/-6575/index.html" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bahaa90231-art.github.io/-6575/index.html" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0A0A0A;
            --bg-elevated: #111111;
            --bg-hover: #1A1A1A;
            --bg-subtle: #161616;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-tertiary: #71717A;
            --primary: #7C3AED;
            --primary-hover: #8B5CF6;
            --primary-subtle: rgba(124, 58, 237, 0.1);
            --gold: #F59E0B;
            --gold-subtle: rgba(245, 158, 11, 0.1);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg: #FAFAFA;
            --bg-elevated: #FFFFFF;
            --bg-hover: #F4F4F5;
            --bg-subtle: #F9F9FA;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.16);
            --text: #09090B;
            --text-secondary: #52525B;
            --text-tertiary: #71717A;
            --primary: #7C3AED;
            --primary-hover: #6D28D9;
            --primary-subtle: rgba(124, 58, 237, 0.08);
            --gold: #D97706;
            --gold-subtle: rgba(217, 119, 6, 0.08);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition), color var(--transition);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: saturate(180%) blur(16px);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            min-height: 60px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
            min-width: 0;
        }

        .header-brand .logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-subtle);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-brand .brand-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            min-width: 0;
        }

        .header-brand .brand-info .name {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-brand .brand-info .tag {
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        body:not(.light-mode) .theme-toggle .fa-sun { display: none; }
        body.light-mode .theme-toggle .fa-moon { display: none; }

        .badge-vip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: var(--gold-subtle);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.02em;
        }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--primary-subtle), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .hero-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22C55E;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hero h1 {
            font-size: clamp(28px, 6vw, 64px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            background: linear-gradient(180deg, var(--text) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(13px, 1.6vw, 16px);
            color: var(--text-secondary);
            max-width: 640px;
            margin: 0 auto 32px;
            line-height: 1.7;
            padding: 0 8px;
        }

        /* ============================================================
           CONTROLS - البحث والتصفية
           ============================================================ */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
            align-items: stretch;
        }

        /* حقل البحث - الأيقونة داخل الحقل */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: block;
        }

        .search-box .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all var(--transition);
            -webkit-appearance: none;
            appearance: none;
        }

        .search-box input::placeholder {
            color: var(--text-tertiary);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-subtle);
        }

        /* أزرار التصفية */
        .filter-group {
            display: flex;
            gap: 6px;
            padding: 4px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .filter-btn {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            -webkit-appearance: none;
            appearance: none;
        }

        .filter-btn:active {
            transform: scale(0.97);
        }

        .filter-btn:hover {
            color: var(--text);
            background: var(--bg-hover);
        }

        .filter-btn.active {
            background: var(--bg);
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }

        /* ============================================================
           NOVEL GRID
           ============================================================ */
        .novel-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, 1fr);
            padding-bottom: 60px;
        }

        .novel-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .novel-card:active {
            transform: scale(0.98);
        }

        .novel-card .cover {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border);
        }

        .novel-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }

        .novel-card .cover .tag {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .novel-card .body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 8px;
        }

        .novel-card .body h3 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .novel-card .body .meta {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 500;
            flex-wrap: wrap;
        }

        .novel-card .body .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .novel-card .body .cta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-top: auto;
            padding-top: 4px;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }

        .empty-state i {
            font-size: 40px;
            opacity: 0.3;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            border-top: 1px solid var(--border);
            padding: 32px 0 24px;
            background: var(--bg-subtle);
        }

        .footer-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .footer-bottom .copy .author {
            color: var(--text);
            font-weight: 600;
        }

        .dev-credit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .dev-credit i {
            color: var(--primary);
            margin-left: 4px;
        }

        .dev-credit .phone {
            direction: ltr;
            color: var(--text-secondary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           RESPONSIVE - تحسينات لكل شاشة
           ============================================================ */

        /* شاشات كبيرة (1400+) */
        @media (min-width: 1400px) {
            .container { padding: 0 40px; }
            .novel-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
            .novel-card .body h3 { font-size: 17px; }
            .novel-card .body { padding: 20px; }
            .novel-card .body .meta { font-size: 12px; }
            .novel-card .body .cta { font-size: 13px; }
            .hero { padding: 80px 0 60px; }
        }

        /* شاشات متوسطة-كبيرة (1100-1399) */
        @media (min-width: 1100px) and (max-width: 1399px) {
            .novel-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        /* تابلت (768-1099) */
        @media (min-width: 768px) and (max-width: 1099px) {
            .novel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }
            .hero { padding: 60px 0 40px; }
            .controls {
                flex-direction: row;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
            }
            .search-box { flex: 1 1 320px; max-width: 480px; }
            .filter-group { width: auto; }
            .filter-btn { flex: initial; padding: 8px 16px; font-size: 13px; }
            .footer-bottom {
                flex-direction: row;
                justify-content: space-between;
                text-align: right;
            }
            .dev-credit {
                flex-direction: row;
                gap: 16px;
            }
        }

        /* تابلت صغير / جوال كبير (480-767) */
        @media (min-width: 480px) and (max-width: 767px) {
            .container { padding: 0 20px; }
            .hero { padding: 40px 0 30px; }
            .hero h1 { font-size: 32px; }
            .hero p { font-size: 14px; margin-bottom: 24px; }
            .hero-badge { font-size: 11px; }
            .controls { margin-bottom: 24px; }
            .search-box input { padding: 12px 44px 12px 14px; font-size: 14px; }
            .filter-btn { font-size: 12px; padding: 8px 10px; }
            .novel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .novel-card .body { padding: 14px; }
            .novel-card .body h3 { font-size: 14px; }
            .novel-card .body .meta { font-size: 11px; gap: 8px; }
            .novel-card .body .cta { font-size: 12px; }
            .footer { padding: 24px 0 16px; }
        }

        /* جوال عادي (375-479) */
        @media (min-width: 375px) and (max-width: 479px) {
            .container { padding: 0 16px; }
            .header-inner { padding: 10px 0; min-height: 56px; }
            .header-brand .logo { width: 36px; height: 36px; }
            .header-brand .brand-info .name { font-size: 13px; }
            .header-brand .brand-info .tag { font-size: 10px; }
            .badge-vip { display: none; }
            .hero { padding: 32px 0 24px; }
            .hero h1 { font-size: 28px; }
            .hero p { font-size: 13px; margin-bottom: 20px; }
            .hero-badge { font-size: 11px; padding: 5px 12px; margin-bottom: 16px; }
            .controls { gap: 10px; margin-bottom: 20px; }
            .search-box input {
                padding: 12px 42px 12px 14px;
                font-size: 13px;
                border-radius: 10px;
            }
            .search-box .search-icon { right: 14px; font-size: 13px; }
            .filter-group { border-radius: 10px; }
            .filter-btn { padding: 8px 10px; font-size: 11px; }
            .novel-grid { gap: 12px; }
            .novel-card .cover .tag { font-size: 9px; padding: 2px 6px; top: 6px; right: 6px; }
            .novel-card .body { padding: 12px; gap: 6px; }
            .novel-card .body h3 { font-size: 13px; }
            .novel-card .body .meta { font-size: 10px; gap: 6px; }
            .novel-card .body .cta { font-size: 11px; }
            .footer { padding: 20px 0 12px; }
            .footer-bottom { font-size: 11px; }
        }

        /* جوال صغير (أقل من 375) */
        @media (max-width: 374px) {
            .container { padding: 0 12px; }
            .header-inner { padding: 8px 0; min-height: 52px; }
            .header-brand .logo { width: 32px; height: 32px; border-radius: 8px; }
            .header-brand .brand-info .name { font-size: 12px; }
            .header-brand .brand-info .tag { display: none; }
            .icon-btn { width: 32px; height: 32px; font-size: 12px; }
            .hero { padding: 24px 0 20px; }
            .hero h1 { font-size: 24px; }
            .hero p { font-size: 12px; margin-bottom: 16px; }
            .hero-badge { font-size: 10px; padding: 4px 10px; margin-bottom: 12px; }
            .search-box input {
                padding: 10px 38px 10px 12px;
                font-size: 12px;
            }
            .search-box .search-icon { right: 12px; font-size: 12px; }
            .filter-btn { padding: 7px 8px; font-size: 10px; }
            .novel-grid { gap: 10px; }
            .novel-card .body { padding: 10px; gap: 5px; }
            .novel-card .body h3 { font-size: 12px; }
            .novel-card .body .meta { font-size: 9px; gap: 5px; }
            .novel-card .body .cta { font-size: 10px; }
            .novel-card .cover .tag { font-size: 8px; padding: 2px 5px; }
        }

        /* شاشات لمسية - تحسينات */
        @media (hover: none) and (pointer: coarse) {
            .novel-card:hover {
                transform: none;
                box-shadow: none;
                border-color: var(--border);
            }
            .novel-card:active {
                transform: scale(0.98);
                background: var(--bg-hover);
            }
            .novel-card:active .cover img {
                transform: scale(1.02);
            }
            .icon-btn:hover {
                background: transparent;
                color: var(--text-secondary);
                border-color: var(--border);
            }
            .icon-btn:active {
                background: var(--bg-hover);
                color: var(--text);
            }
            .filter-btn:hover {
                background: transparent;
                color: var(--text-secondary);
            }
            .filter-btn:active {
                background: var(--bg-hover);
                color: var(--text);
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="header-brand">
                    <div class="logo">
                        <img src="favicon.png" alt="شعار" onerror="this.parentElement.innerHTML='📚'; this.parentElement.style.fontSize='18px';" />
                    </div>
                    <div class="brand-info">
                        <span class="name">شادي رحال</span>
                        <span class="tag">مكتبة الروايات</span>
                    </div>
                </a>

                <div class="header-actions">
                    <button class="icon-btn theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun"></i>
                    </button>
                    <div class="badge-vip">
                        <i class="fas fa-crown"></i>
                        <span>VIP</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <div class="hero-badge">
                <span class="dot"></span>
                <span>مكتبة روايات عربية</span>
            </div>
            <h1>
                روايات عربية <span class="gradient">بجودة عالمية</span>
            </h1>
            <p>
                اكتشف مجموعة مختارة من الروايات العربية المميزة للكاتب شادي رحال.
                اقرأ، استمتع، وحمّل بصيغة PDF مجاناً.
            </p>
        </div>
    </section>

    <!-- CONTROLS + GRID -->
    <section>
        <div class="container">
            <div class="controls">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="ابحث عن رواية..." aria-label="بحث" />
                </div>
                <div class="filter-group" id="filterGroup">
                    <button class="filter-btn active" data-filter="all">الكل</button>
                    <button class="filter-btn" data-filter="رومانسية">💕 رومانسية</button>
                    <button class="filter-btn" data-filter="اجتماعية">🏙️ اجتماعية</button>
                </div>
            </div>

            <div class="novel-grid" id="novelGrid"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div class="copy">
                    جميع الحقوق محفوظة &copy; 2026 <span class="author">شادي رحال</span> ❤️
                </div>
                <div class="dev-credit">
                    <span><i class="fas fa-code"></i> برمجة وتطوير: بهاء الدين الحسين</span>
                    <span class="phone"><i class="fas fa-phone"></i> 0982520358</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // THEME TOGGLE
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.body.classList.add('light-mode');
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('light-mode');
                const isLight = document.body.classList.contains('light-mode');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            });
        })();

        // ============================================================
        //  DATA - الروايات
        // ============================================================
        const novels = [
            {
                id: 'skylane',
                title: 'سكاي لاين',
                category: 'رومانسية',
                chapters: 19,
                image: 'skylane.jpg',
                description: 'قصة حب بين أستاذ وطالبة، تبدأ بكرسي وطاولة وتنتهي بوعد ودمعة. رحلة من الحلم إلى الواقع في وادي الياسمين.',
                file: 'skylane.html'
            },
            {
                id: 'places',
                title: 'الأماكن',
                category: 'رومانسية',
                chapters: 13,
                image: 'places.jpg',
                description: 'أربع سنوات من الوفاء والانتظار. رحلة عبر الأماكن التي شهدت حباً لا يموت، ومواجهة مع الزمن والذكريات.',
                file: 'places.html'
            },
            {
                id: 'what-if-war',
                title: 'ماذا لو ما كانت الحرب؟',
                category: 'اجتماعية',
                chapters: 10,
                image: 'what-if-war.jpg',
                description: 'رواية تأملية عن النزوح والفقد والأمل. سؤال واحد يغير كل شيء: ماذا لو لم تكن الحرب؟',
                file: 'what-if-war.html'
            }
        ];

        // ============================================================
        //  RENDER
        // ============================================================
        const grid = document.getElementById('novelGrid');
        const searchInput = document.getElementById('searchInput');
        let activeFilter = 'all';

        function render() {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = novels.filter(n => {
                const matchFilter = activeFilter === 'all' || n.category === activeFilter;
                const matchSearch = n.title.includes(query) ||
                    n.category.includes(query) ||
                    n.description.includes(query);
                return matchFilter && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <p>لا توجد روايات تطابق البحث</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(n => `
                <article class="novel-card" data-file="${n.file}">
                    <div class="cover">
                        <img src="${n.image}" alt="غلاف ${n.title}" loading="lazy" onerror="this.style.display='none'" />
                        <span class="tag">${n.category}</span>
                    </div>
                    <div class="body">
                        <h3>${n.title}</h3>
                        <div class="meta">
                            <span><i class="fas fa-book"></i> ${n.chapters} فصل</span>
                        </div>
                        <span class="cta">
                            اقرأ الآن <i class="fas fa-arrow-left"></i>
                        </span>
                    </div>
                </article>
            `).join('');

            document.querySelectorAll('.novel-card').forEach(card => {
                card.addEventListener('click', function() {
                    const file = this.dataset.file;
                    if (file) window.location.href = file;
                });
            });
        }

        // FILTERS
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.dataset.filter;
                render();
            });
        });

        searchInput.addEventListener('input', render);
        render();
    </script>
</body>
</html>
